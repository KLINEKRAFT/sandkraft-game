<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SANDKRAFT">
<meta name="theme-color" content="#000000">
<meta name="description" content="SANDKRAFT — a static procedural desert you can drive. Single file, no build step.">
<title>SANDKRAFT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
  --accent:#84b4dd;
  --accent-dim:#4e7ba6;
  --steel:#6e90ae;
  --dim:#54687c;
  --panel:rgba(132,180,221,.07);
  --line:rgba(132,180,221,.22);
  --hud-pad:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;width:100%;background:#000;overflow:hidden;position:fixed;}
body{
  font-family:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color:#c6d8e8;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  touch-action:none;overscroll-behavior:none;overscroll-behavior-y:none;
}
canvas#gl{position:fixed;top:0;left:0;width:100%;height:100%;display:block;background:#000;}

#hud{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:10;
  font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  opacity:0;transition:opacity .7s ease .25s;}
#hud.live{opacity:1;}
.pad{position:absolute;}

/* ---- compass ---- */
#compass{top:calc(var(--sat) + 8px);left:calc(50% + (var(--sal) - var(--sar)) / 2);transform:translateX(-50%);
  width:min(46vw,320px);height:26px;overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent);}
#tape{position:absolute;top:0;left:0;height:100%;will-change:transform;}
#tape i{position:absolute;top:14px;width:1px;height:6px;background:var(--line);}
#tape b{position:absolute;top:0;font-weight:500;font-size:10px;color:var(--steel);
  transform:translateX(-50%);letter-spacing:.12em;}
#tape b.card{color:var(--accent);}
#tape i.major{top:10px;height:10px;background:rgba(132,180,221,.45);}
#needle{position:absolute;left:50%;top:0;width:1px;height:26px;background:var(--accent);
  box-shadow:0 0 6px rgba(132,180,221,.8);}
#bearing{top:calc(var(--sat) + 34px);left:calc(50% + (var(--sal) - var(--sar)) / 2);transform:translateX(-50%);
  font-size:10px;color:var(--dim);}

/* ---- speed ---- */
#speedbox{left:calc(var(--sal) + var(--hud-pad));bottom:calc(var(--sab) + var(--hud-pad));
  display:flex;align-items:flex-end;gap:6px;}
#speed{font-size:54px;line-height:.82;font-weight:500;color:#eaf3fb;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;text-shadow:0 0 22px rgba(132,180,221,.25);}
#unit{font-size:10px;color:var(--dim);padding-bottom:6px;}
#gauge{left:calc(var(--sal) + var(--hud-pad));bottom:calc(var(--sab) + var(--hud-pad) + 60px);
  width:132px;height:3px;background:rgba(132,180,221,.13);}
#gauge>span{display:block;height:100%;width:0%;background:var(--accent);box-shadow:0 0 8px rgba(132,180,221,.6);
  transition:width .06s linear;}
#tele{left:calc(var(--sal) + var(--hud-pad));bottom:calc(var(--sab) + var(--hud-pad) + 74px);
  font-size:10px;color:var(--dim);line-height:1.7;}
#tele span{color:var(--steel);}
#tele span.warn{color:#e8a05c;}
#tele span.bad{color:#e2705a;}
#dmgbar{left:calc(var(--sal) + var(--hud-pad));bottom:calc(var(--sab) + var(--hud-pad) + 66px);
  width:132px;height:3px;background:rgba(132,180,221,.13);}
#dmgbar>span{display:block;height:100%;width:0%;background:#e2705a;
  box-shadow:0 0 8px rgba(226,112,90,.6);transition:width .18s linear;}

/* ---- steer readout ---- */
#steerbar{left:calc(50% + (var(--sal) - var(--sar)) / 2);transform:translateX(-50%);bottom:calc(var(--sab) + 10px);
  width:min(38vw,220px);height:2px;background:rgba(132,180,221,.13);}
#steerbar>i{position:absolute;top:-3px;left:50%;width:2px;height:8px;background:var(--accent);
  transform:translateX(-50%);box-shadow:0 0 8px rgba(132,180,221,.7);}
#steerbar>u{position:absolute;top:-6px;left:50%;width:1px;height:14px;background:rgba(132,180,221,.25);}

/* ---- buttons ---- */
#tools{top:calc(var(--sat) + 8px);right:calc(var(--sar) + var(--hud-pad));
  display:flex;gap:6px;pointer-events:auto;}
.tool{pointer-events:auto;padding:7px 9px;font:inherit;font-size:9.5px;letter-spacing:.1em;
  color:var(--steel);background:var(--panel);border:1px solid var(--line);border-radius:3px;
  text-transform:uppercase;}
.tool.on{color:#04111c;background:var(--accent);border-color:var(--accent);}

/* ---- pedals ---- */
#gas,#brk{pointer-events:auto;position:absolute;right:calc(var(--sar) + var(--hud-pad));
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line);background:var(--panel);color:var(--steel);
  font-size:10px;letter-spacing:.12em;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
#gas{width:104px;height:104px;bottom:calc(var(--sab) + 22px);}
#brk{width:74px;height:74px;bottom:calc(var(--sab) + 138px);right:calc(var(--sar) + var(--hud-pad) + 16px);}
#gas.hit,#brk.hit{background:rgba(132,180,221,.30);color:#eaf3fb;border-color:var(--accent);
  box-shadow:0 0 26px rgba(132,180,221,.28) inset;}
#hbk{pointer-events:auto;position:absolute;right:calc(var(--sar) + var(--hud-pad) + 112px);
  bottom:calc(var(--sab) + 30px);width:58px;height:58px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;border:1px solid var(--line);
  background:var(--panel);color:var(--dim);font-size:9px;letter-spacing:.1em;}
#hbk.hit{background:rgba(221,140,132,.28);color:#ffe6e0;border-color:rgba(221,140,132,.7);}

/* ---- steering stick ---- */
#stick{position:absolute;width:132px;height:36px;margin:-18px 0 0 -66px;border:1px solid var(--line);
  border-radius:18px;background:rgba(4,10,16,.45);opacity:0;transition:opacity .12s;pointer-events:none;}
#stick.on{opacity:1;}
#stick>i{position:absolute;top:50%;left:50%;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;
  background:rgba(132,180,221,.5);box-shadow:0 0 16px rgba(132,180,221,.5);}

#hint{position:absolute;top:calc(var(--sat) + 52px);left:calc(50% + (var(--sal) - var(--sar)) / 2);transform:translateX(-50%);
  font-size:9px;color:rgba(84,104,124,.8);white-space:nowrap;transition:opacity 1.2s ease;}
#fps{top:calc(var(--sat) + 8px);left:calc(var(--sal) + var(--hud-pad));
  font-size:9.5px;color:var(--dim);}

/* ---- animated cover ---- */
#boot{position:fixed;top:0;left:0;right:0;bottom:0;z-index:30;display:flex;flex-direction:column;
  justify-content:space-between;align-items:center;text-align:center;
  padding:calc(var(--sat) + 16px) calc(var(--sar) + 18px) calc(var(--sab) + 16px) calc(var(--sal) + 18px);
  transition:opacity .75s ease;}
#boot.gone{opacity:0;pointer-events:none;}
#curtain{position:absolute;top:0;left:0;right:0;bottom:0;background:#05080b;
  transition:opacity 1.5s ease .15s;}
#boot.lit #curtain{opacity:0;}
/* the cover artwork carries its own wordmark, so it replaces the built one.
   Portrait only — the art is 9:16 and landscape gets the live orbit instead. */
#coverart{position:absolute;top:0;left:0;right:0;bottom:0;display:none;
  background-position:center;background-repeat:no-repeat;background-size:cover;
  animation:kenburns 26s ease-in-out infinite alternate;}
@keyframes kenburns{from{transform:scale(1.02) translateY(0.6%);}to{transform:scale(1.08) translateY(-0.8%);}}
body.art #coverart{display:block;}
body.art #cover-top{display:none;}
body.art #boot{justify-content:flex-end;}   /* only the bottom block is left */
body.art #grain{opacity:.03;}
body.art #scrim{background:linear-gradient(180deg,
  rgba(5,9,13,0) 0%, rgba(5,9,13,0) 68%, rgba(5,9,13,.20) 82%, rgba(5,9,13,.66) 100%);}
#scrim{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;
  background:linear-gradient(180deg, rgba(5,9,13,.55) 0%, rgba(5,9,13,.22) 26%, rgba(5,9,13,0) 48%,
    rgba(5,9,13,.24) 74%, rgba(5,9,13,.72) 100%);}
#grain{position:absolute;top:-25%;left:-25%;right:-25%;bottom:-25%;pointer-events:none;opacity:.05;
  background:repeating-linear-gradient(104deg,#fff 0 1px,transparent 1px 7px);
  animation:drift 7.5s linear infinite;}
@keyframes drift{from{transform:translate3d(0,0,0);}to{transform:translate3d(-48px,13px,0);}}

#cover-top,#cover-bottom{position:relative;width:100%;}
#cover-top{padding-top:2vh;}
#wordmark{font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold",system-ui,-apple-system,sans-serif;
  font-weight:800;letter-spacing:-.012em;line-height:.94;text-transform:none;
  font-size:clamp(40px,min(13.5vw,19vh),104px);
  animation:float 7s ease-in-out infinite 1.2s;}
#wordmark span{display:inline-block;opacity:0;transform:translateY(30px) scale(.94);
  animation:rise 1s cubic-bezier(.16,.92,.24,1) forwards;color:#e3caa6;
  text-shadow:0 2px 0 #ab8259,0 4px 0 #8c6845,0 6px 0 #6d5034,0 9px 0 #513c27,0 14px 30px rgba(0,0,0,.6);}
#wordmark span:nth-child(2){animation-delay:.14s;color:#f2e0c3;}
@keyframes rise{to{opacity:1;transform:translateY(0) scale(1);}}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
#rule{width:0;height:1px;margin:14px auto 0;background:linear-gradient(90deg,transparent,var(--accent),transparent);
  animation:widen 1.3s ease .5s forwards;}
@keyframes widen{to{width:min(62%,320px);}}
#tagline{margin-top:10px;font-size:9.5px;letter-spacing:.34em;color:#dbe7f1;opacity:0;
  text-shadow:0 1px 4px rgba(0,0,0,.7);
  animation:fadein .9s ease .85s forwards;}
@keyframes fadein{to{opacity:.85;}}

#cover-bottom{display:flex;flex-direction:column;align-items:center;gap:12px;}
#bar{width:min(62vw,280px);height:2px;background:rgba(226,201,166,.18);overflow:hidden;}
#bar>span{display:block;height:100%;width:0%;background:var(--accent);transition:width .25s ease;
  box-shadow:0 0 10px rgba(132,180,221,.7);}
#status{font-size:9px;color:#dbe7f1;letter-spacing:.24em;height:12px;text-shadow:0 1px 4px rgba(0,0,0,.7);}
#go{pointer-events:auto;padding:15px 30px;font:inherit;font-size:11px;letter-spacing:.26em;
  color:#08151f;background:var(--accent);border:0;border-radius:4px;text-transform:uppercase;
  opacity:0;transform:translateY(10px);transition:opacity .55s ease,transform .55s ease;}
#go.ready{opacity:1;transform:none;animation:pulse 2.8s ease-in-out .7s infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(132,180,221,.5);}55%{box-shadow:0 0 0 16px rgba(132,180,221,0);}}
#legal{font-size:8px;letter-spacing:.2em;color:rgba(219,231,241,.55);text-shadow:0 1px 4px rgba(0,0,0,.6);}

@media (max-height:430px){
  #cover-top{padding-top:0;}
  #wordmark{font-size:clamp(34px,13vh,60px);}
  #rule{margin-top:8px;}
  #tagline{margin-top:6px;font-size:8.5px;}
  #cover-bottom{gap:8px;}
  #go{padding:12px 24px;}
}
@media (orientation:portrait) and (max-width:520px){
  #compass{top:calc(var(--sat) + 46px);width:min(78vw,300px);}
  #bearing{top:calc(var(--sat) + 72px);}
  #hint{top:calc(var(--sat) + 90px);white-space:normal;width:80vw;text-align:center;line-height:1.6;}
  #tools{left:calc(var(--sal) + var(--hud-pad));right:auto;}
  #fps{top:calc(var(--sat) + 46px);left:auto;right:calc(var(--sar) + var(--hud-pad));}
  #speed{font-size:44px;}
  #gas{width:92px;height:92px;}
  #brk{width:66px;height:66px;bottom:calc(var(--sab) + 126px);}
  #hbk{display:none;}
  #hint{font-size:8px;}
}
@media (min-width:900px){ #gas,#brk,#hbk{display:none;} }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="hud">
  <div class="pad" id="fps"></div>
  <div class="pad" id="compass"><div id="tape"></div><div id="needle"></div></div>
  <div class="pad" id="bearing">—</div>

  <div class="pad" id="tele">
    ALT <span id="t-alt">0</span> M &nbsp; GRADE <span id="t-grade">0</span>%<br>
    SURF <span id="t-surf">SAND</span> &nbsp; DIST <span id="t-dist">0.0</span> KM<br>
    HULL <span id="t-dmg">100</span>% &nbsp; HITS <span id="t-hits">0</span>
  </div>
  <div class="pad" id="dmgbar"><span id="d-fill"></span></div>
  <div class="pad" id="gauge"><span id="g-fill"></span></div>
  <div class="pad" id="speedbox"><div id="speed">0</div><div id="unit">MPH</div></div>
  <div class="pad" id="steerbar"><u></u><i></i></div>

  <div class="pad" id="tools">
    <button class="tool" id="b-cam">CAM</button>
    <button class="tool" id="b-tilt">TILT</button>
    <button class="tool" id="b-aud">AUD</button>
    <button class="tool" id="b-res">RESET</button>
  </div>

  <div id="gas">GAS</div>
  <div id="brk">BRK</div>
  <div id="hbk">HAND</div>
  <div id="stick"><i></i></div>
  <div id="hint">DRAG THE LEFT HALF TO STEER · HOLD GAS · WASD ON A KEYBOARD</div>
</div>

<div id="boot">
  <div id="curtain"></div>
  <div id="coverart"></div>
  <div id="scrim"></div>
  <div id="grain"></div>
  <div id="cover-top">
    <div id="wordmark"><span>Sand</span><span>Kraft</span></div>
    <div id="rule"></div>
    <div id="tagline">PROCEDURAL DESERT &middot; SEED 1337</div>
  </div>
  <div id="cover-bottom">
    <div id="bar"><span id="bar-fill"></span></div>
    <div id="status">BOOTING</div>
    <button id="go">TAP TO DRIVE</button>
    <div id="legal">WEBGL2 &middot; SINGLE FILE &middot; NO BUILD STEP</div>
  </div>
</div>

<script>
"use strict";
/* =========================================================================
   SANDKRAFT — static procedural desert, single file, no build step.
   0  math                       4  props / landmarks
   1  noise + terrain field      5  vehicle (raycast suspension)
   2  gl plumbing + shaders      6  camera / input / hud / audio
   3  chunked quadtree LOD       7  main loop
   ========================================================================= */

   is imported, in which case the procedural body below is skipped. */

/* ------------------------------------------- 1 noise + terrain field ---- */
const SEED = 1337;

function hash2(ix, iz) {
  let h = Math.imul(ix | 0, 0x27d4eb2d) ^ Math.imul(iz | 0, 0x165667b1) ^ SEED;
  h = Math.imul(h ^ (h >>> 15), 0x2545f491);
  h ^= h >>> 13;
  h = Math.imul(h, 0x27d4eb2d);
  h ^= h >>> 16;
  return (h >>> 0) * 2.3283064365386963e-10;
}
/* value noise, quintic interpolation */
function vnoise2(x, z) {
  const x0 = Math.floor(x), z0 = Math.floor(z);
  const fx = x - x0, fz = z - z0;
  const ux = fx * fx * fx * (fx * (fx * 6 - 15) + 10);
  const uz = fz * fz * fz * (fz * (fz * 6 - 15) + 10);
  const a = hash2(x0, z0), b = hash2(x0 + 1, z0), c = hash2(x0, z0 + 1), d = hash2(x0 + 1, z0 + 1);
  return a + (b - a) * ux + (c - a) * uz + (a - b - c + d) * ux * uz;
}
/* fbm with per-octave rotation to kill axis alignment */
function fbm(x, z, oct) {
  let sum = 0, amp = 0.5, norm = 0;
  for (let i = 0; i < oct; i++) {
    sum += amp * vnoise2(x, z);
    norm += amp;
    amp *= 0.5;
    const nx = 1.6 * (0.8 * x + 0.6 * z) + 37.1;
    const nz = 1.6 * (-0.6 * x + 0.8 * z) + 11.7;
    x = nx; z = nz;
  }
  return sum / norm;
}

/* dune direction (crests run perpendicular to this) */
const WIND_A = 0.55;
const WDX = Math.cos(WIND_A), WDZ = Math.sin(WIND_A);
const WIND_B = WIND_A + 0.32;
const WBX = Math.cos(WIND_B), WBZ = Math.sin(WIND_B);
const DUNE_L = 160, DUNE_K = 0.66;

/* asymmetric dune profile: long windward rise, short steep lee slip face */
function duneProfile(f) {
  if (f < DUNE_K) return 0.5 - 0.5 * Math.cos(Math.PI * f / DUNE_K);
  return 0.5 + 0.5 * Math.cos(Math.PI * (f - DUNE_K) / (1 - DUNE_K));
}
/* ramp profile: 78% run-up, 22% drop — a lip you can launch off */
const KICK_K = 0.80;
function kickProfile(f) {
  if (f < KICK_K) return 0.5 - 0.5 * Math.cos(Math.PI * f / KICK_K);
  return 0.5 + 0.5 * Math.cos(Math.PI * (f - KICK_K) / (1 - KICK_K));

  if (k < 0.001) return 0;
  const ph = s / 62 + (fbm(x * 0.0042 + 3.3, z * 0.0042 - 9.1, 2) - 0.5) * 2.4;
  return 8.0 * k * kickProfile(fract(ph));
}

/* broad swells only — also the road's grade profile */
function baseSwell(x, z) {
  return (fbm(x * 0.00075, z * 0.00075, 4) - 0.5) * 132;
}
/* the road: gently wandering line running roughly north-south */
function roadCenterX(z) {
  return 132 * Math.sin(z * 0.00055) + 58 * Math.sin(z * 0.00017 + 2.1);
}
function roadBase(z) { return baseSwell(roadCenterX(z), z) + 0.9; }

function roadness(x, z) {

/* full terrain height — the single source of truth for mesh AND physics */
function heightAt(x, z) {
  const base = baseSwell(x, z);
  const mask = smoothstep(0.24, 0.44, fbm(x * 0.0006 + 41.3, z * 0.0006 - 17.7, 3));

  const s = x * WDX + z * WDZ;
  const t = -x * WDZ + z * WDX;

  const phase = s / DUNE_L + warp + (vnoise2(t * 0.0032, s * 0.0011) - 0.5) * 1.5;
  const amp = mask * (14 + 17 * fbm(x * 0.0013 + 21.5, z * 0.0013 + 5.5, 2));
  let h = base + amp * duneProfile(fract(phase));

  const s2 = x * WBX + z * WBZ;
  const ph2 = s2 / 46 + (fbm(x * 0.0062 + 13.7, z * 0.0062 - 4.1, 2) - 0.5) * 2.0;
  h += 3.6 * mask * duneProfile(fract(ph2));

  const s = x * WDX + z * WDZ;
  const t = -x * WDZ + z * WDX;
  const warp = (fbm(x * 0.0021 + 7.1, z * 0.0021 + 3.3, 2) - 0.5) * 2.2;
  const phase = s / DUNE_L + warp + (vnoise2(t * 0.0032, s * 0.0011) - 0.5) * 1.5;
  const amp = mask * (14 + 17 * fbm(x * 0.0013 + 21.5, z * 0.0013 + 5.5, 2));

  if (dr < 46) h += (roadBase(z) - h) * (smoothstep(46, 13, dr) * 0.93);

/* terrain normal, analytic-ish central difference (physics) */
function normalAt(out, x, z, eps) {
  eps = eps || 0.6;
  const hl = heightAt(x - eps, z), hr = heightAt(x + eps, z);
  const hd = heightAt(x, z - eps), hu = heightAt(x, z + eps);

/* sun */
const SUN_EL = 16 * DEG, SUN_BEAR = 245 * DEG;   // low and raking across the dune field
const SUN_HX = Math.sin(SUN_BEAR), SUN_HZ = Math.cos(SUN_BEAR);
const SUN = v3(Math.cos(SUN_EL) * SUN_HX, Math.sin(SUN_EL), Math.cos(SUN_EL) * SUN_HZ);
const SUN_TAN = Math.tan(SUN_EL);

/* baked sun visibility: march the coarse field toward the sun */
const SHADOW_STEPS = [2, 5, 9, 15, 24, 38, 58, 88];
function sunVis(x, y, z) {
  let v = 1;
  for (let i = 0; i < SHADOW_STEPS.length; i++) {
    const d = SHADOW_STEPS[i];
    const ray = y + d * SUN_TAN;
    const th = heightCoarse(x + SUN_HX * d, z + SUN_HZ * d);
    const s = smoothstep(-0.6 - d * 0.05, 1.0 + d * 0.09, ray - th);

  }

const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl2', {
  alpha: false, antialias: false, depth: true, stencil: false,
  powerPreference: 'high-performance', preserveDrawingBuffer: false,
  failIfMajorPerformanceCaveat: false
});
if (!gl) {
  document.getElementById('status').textContent = 'WEBGL2 NOT AVAILABLE';
  throw new Error('webgl2 unavailable');
}

function shader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(s);
    console.error(log, src.split('\n').map((l, i) => (i + 1) + ': ' + l).join('\n'));
    throw new Error('shader compile: ' + log);
  }
  return s;
}
function program(vsSrc, fsSrc, name) {
  const p = gl.createProgram();
  gl.attachShader(p, shader(gl.VERTEX_SHADER, vsSrc));
  gl.attachShader(p, shader(gl.FRAGMENT_SHADER, fsSrc));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(name + ' link: ' + gl.getProgramInfoLog(p));
  const u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) {
    const info = gl.getActiveUniform(p, i);
    u[info.name.replace('[0]', '')] = gl.getUniformLocation(p, info.name);
  }
  return { p, u, name };
}

const MESH_VS = VERSION + `
precision highp float;
layout(location=0) in vec3 aPos;
layout(location=1) in vec3 aNrm;
layout(location=2) in vec3 aCol;
uniform mat4 uViewProj;
uniform mat4 uModel;
out vec3 vWorld; out vec3 vNrm; out vec3 vCol;
void main(){
  vec4 w = uModel * vec4(aPos, 1.0);
  vWorld = w.xyz;
  vNrm = mat3(uModel) * aNrm;
  vCol = aCol;
  gl_Position = uViewProj * w;
}`;

/* instanced: iPS = xyz + uniform scale, iRT = (yaw, tint, yScale, tilt).
   Tilt rotates about local X before the yaw, so a knocked drum can lie over;
   at tilt 0 this is the identity and every other prop is unaffected. */
const INST_VS = VERSION + `
precision highp float;
layout(location=0) in vec3 aPos;
layout(location=1) in vec3 aNrm;
layout(location=2) in vec3 aCol;
layout(location=3) in vec4 iPS;
layout(location=4) in vec4 iRT;
uniform mat4 uViewProj;
out vec3 vWorld; out vec3 vNrm; out vec3 vCol;
void main(){
  float ct = cos(iRT.w), st = sin(iRT.w);
  vec3 tp = vec3(aPos.x, aPos.y * ct - aPos.z * st, aPos.y * st + aPos.z * ct);
  vec3 tn = vec3(aNrm.x, aNrm.y * ct - aNrm.z * st, aNrm.y * st + aNrm.z * ct);
  float c = cos(iRT.x), s = sin(iRT.x);
  vec3 lp = vec3(tp.x * c + tp.z * s, tp.y, -tp.x * s + tp.z * c);
  vec3 ln = vec3(tn.x * c + tn.z * s, tn.y, -tn.x * s + tn.z * c);
  vec3 w = lp * vec3(iPS.w, iRT.z, iPS.w) + iPS.xyz;
  vWorld = w; vNrm = normalize(ln); vCol = aCol * iRT.y;
  gl_Position = uViewProj * vec4(w, 1.0);
}`;

/* ---- blob shadow: multiplicative darkening conformed to the ground ---- */
const SHADOW_VS = VERSION + `
precision highp float;
layout(location=0) in vec3 aPos;
layout(location=1) in float aA;
uniform mat4 uViewProj;
out float vA;
void main(){ vA = aA; gl_Position = uViewProj * vec4(aPos, 1.0); }`;
const SHADOW_FS = VERSION + `
precision highp float;
in float vA;
out vec4 outColor;
void main(){ outColor = vec4(mix(vec3(1.0), vec3(0.34, 0.30, 0.31), clamp(vA, 0.0, 1.0)), 1.0); }`;

/* ---- dust points ---- */
const DUST_VS = VERSION + `
precision highp float;
layout(location=0) in vec3 aPos;
layout(location=1) in vec2 aData;   // size, alpha
uniform mat4 uViewProj;
uniform vec3 uCamPos;
uniform float uPxScale;
out float vAlpha; out float vDist;
void main(){
  vec4 cp = uViewProj * vec4(aPos, 1.0);
  float d = length(aPos - uCamPos);
  vDist = d; vAlpha = aData.y;
  gl_PointSize = clamp(aData.x * uPxScale / max(d, 1.0), 1.0, 90.0);
  gl_Position = cp;
}`;
const DUST_FS = VERSION + COMMON + `
in float vAlpha; in float vDist;
out vec4 outColor;
void main(){
  vec2 q = gl_PointCoord - 0.5;
  float r = dot(q, q);
  if (r > 0.25) discard;
  float a = vAlpha * (1.0 - smoothstep(0.04, 0.25, r));
  vec3 c = vec3(0.82, 0.69, 0.50);
  float f = 1.0 - exp(-pow(vDist * uFogD, 2.0));
  c = mix(c, vec3(0.82, 0.72, 0.58), f);
  outColor = vec4(pow(aces(c * uExposure), vec3(1.0 / 2.2)), a);
}`;

/* ---- cables ---- */
const LINE_VS = VERSION + `
precision highp float;
layout(location=0) in vec3 aPos;
uniform mat4 uViewProj;
uniform vec3 uCamPos;
out float vDist;
void main(){ vDist = length(aPos - uCamPos); gl_Position = uViewProj * vec4(aPos, 1.0); }`;
const LINE_FS = VERSION + COMMON + `
in float vDist;
out vec4 outColor;
void main(){
  vec3 c = vec3(0.09, 0.08, 0.08);
  float f = 1.0 - exp(-pow(vDist * uFogD, 2.0));
  c = mix(c, vec3(0.72, 0.62, 0.50), f);
  outColor = vec4(pow(aces(c * uExposure), vec3(1.0 / 2.2)), 1.0 - f * 0.55);
}`;

/* ---- tyre tracks: stamped into a scrolling accumulation map ---- */
/* aSeg.xy is the world position, aSeg.z is -1..1 across the tyre width,
   aSeg.w is how hard that wheel was pressing */
const STAMP_VS = VERSION + `
precision highp float;
layout(location=0) in vec4 aSeg;
uniform vec2 uOrigin;
uniform float uSpan;
out float vSide;
out float vStrength;
void main(){
  vSide = aSeg.z;
  vStrength = aSeg.w;
  vec2 uv = (aSeg.xy - uOrigin) / uSpan;
  gl_Position = vec4(uv * 2.0 - 1.0, 0.0, 1.0);
}`;
const STAMP_FS = VERSION + `
precision highp float;
in float vSide;
in float vStrength;
out vec4 outColor;
void main(){
  /* soft shoulders so the rut has an edge rather than a hard band */
  float a = 1.0 - smoothstep(0.42, 1.0, abs(vSide));
  outColor = vec4(a * vStrength, 0.0, 0.0, 1.0);
}`;

/* re-anchoring blit: copy the old map back offset by however far it scrolled */
const BLIT_VS = VERSION + `
out vec2 vUv;
void main(){
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  vUv = p;
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;
const BLIT_FS = VERSION + `
precision highp float;
in vec2 vUv;
uniform sampler2D uSrc;
uniform vec2 uShift;
uniform float uFade;
out vec4 outColor;
void main(){
  vec2 uv = vUv + uShift;
  float v = (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0)
    ? 0.0 : texture(uSrc, uv).r * uFade;
  outColor = vec4(v, 0.0, 0.0, 1.0);
}`;

const P = {
  sky: program(SKY_VS, SKY_FS, 'sky'),
  stamp: program(STAMP_VS, STAMP_FS, 'stamp'),
  blit: program(BLIT_VS, BLIT_FS, 'blit'),
  terrain: program(TERRAIN_VS, TERRAIN_FS, 'terrain'),
  mesh: program(MESH_VS, MESH_FS, 'mesh'),
  inst: program(INST_VS, MESH_FS, 'inst'),
  shadow: program(SHADOW_VS, SHADOW_FS, 'shadow'),
  dust: program(DUST_VS, DUST_FS, 'dust'),
  line: program(LINE_VS, LINE_FS, 'line')
};

const FOG_D = 0.00047;
const EXPOSURE = 1.00;
function bindCommon(pr, viewProj, camPos) {
  gl.useProgram(pr.p);
  if (pr.u.uViewProj) gl.uniformMatrix4fv(pr.u.uViewProj, false, viewProj);
  if (pr.u.uCamPos) gl.uniform3f(pr.u.uCamPos, camPos.x, camPos.y, camPos.z);
  if (pr.u.uSunDir) gl.uniform3f(pr.u.uSunDir, SUN.x, SUN.y, SUN.z);
  if (pr.u.uFogD) gl.uniform1f(pr.u.uFogD, FOG_D);
  if (pr.u.uExposure) gl.uniform1f(pr.u.uExposure, EXPOSURE);
  if (pr.u.uWind) gl.uniform2f(pr.u.uWind, WDX, WDZ);
}

/* --------------------------------------------- 3 chunked quadtree LOD --- */
const CRES = 24;                 // cells per chunk edge
const ROOT = 3072;               // root node size (CRES * 128)
let MIN_LEAF = 48;               // finest node size -> 2 m cells
let SPLIT = 1.6;                 // split when nearest distance < size * SPLIT
let FAR_CULL = 2600;
const SHADOW_MAX_SIZE = 192;     // bake sun shadows on nodes at least this fine
const Y_MIN = -220, Y_MAX = 240;

/* one shared index buffer — every chunk has identical topology */
const IBO = (() => {
  const n = CRES + 1;
  const idx = new Uint16Array(CRES * CRES * 6 + 4 * CRES * 6);
  let p = 0;
  for (let j = 0; j < CRES; j++) {
    for (let i = 0; i < CRES; i++) {
      const a = j * n + i, b = a + 1, c = a + n, d = c + 1;
      idx[p++] = a; idx[p++] = c; idx[p++] = b;
      idx[p++] = b; idx[p++] = c; idx[p++] = d;
    }
  }
  const skirtBase = n * n;
  for (let e = 0; e < 4; e++) {
    for (let k = 0; k < CRES; k++) {
      let g0, g1;
      if (e === 0) { g0 = k; g1 = k + 1; }
      else if (e === 1) { g0 = (n - 1) * n + k; g1 = g0 + 1; }
      else if (e === 2) { g0 = k * n; g1 = g0 + n; }
      else { g0 = k * n + (n - 1); g1 = g0 + n; }
      const s0 = skirtBase + e * n + k, s1 = s0 + 1;
      idx[p++] = g0; idx[p++] = s0; idx[p++] = g1;
      idx[p++] = g1; idx[p++] = s0; idx[p++] = s1;
    }
  }
  const b = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, b);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idx, gl.STATIC_DRAW);
  return { buf: b, count: p };
})();

const VSTRIDE = 8;   // pos3 nrm3 shade road
function buildChunkVerts(size, ox, oz, withShadow) {
  const cs = size / CRES, n = CRES + 1, hn = n + 2;
  const H = new Float32Array(hn * hn);
  for (let j = 0; j < hn; j++) {
    const z = oz + (j - 1) * cs;
    for (let i = 0; i < hn; i++) H[j * hn + i] = heightAt(ox + (i - 1) * cs, z);
  }
  const verts = new Float32Array((n * n + 4 * n) * VSTRIDE);
  let p = 0, minY = 1e9, maxY = -1e9;
  for (let j = 0; j < n; j++) {
    const z = oz + j * cs;
    for (let i = 0; i < n; i++) {
      const x = ox + i * cs;
      const h = H[(j + 1) * hn + (i + 1)];
      const hl = H[(j + 1) * hn + i], hr = H[(j + 1) * hn + i + 2];
      const hd = H[j * hn + i + 1], hu = H[(j + 2) * hn + i + 1];
      let nx = hl - hr, ny = 2 * cs, nz = hd - hu;
      const inv = 1 / (Math.hypot(nx, ny, nz) || 1);
      verts[p] = i * cs; verts[p + 1] = h; verts[p + 2] = j * cs;
      verts[p + 3] = nx * inv; verts[p + 4] = ny * inv; verts[p + 5] = nz * inv;
      verts[p + 6] = withShadow ? sunVis(x, h, z) : 1;
      verts[p + 7] = roadness(x, z);
      p += VSTRIDE;
      if (h < minY) minY = h;
      if (h > maxY) maxY = h;
    }
  }
  /* skirts hide the cracks between LOD levels */
  const drop = Math.max(cs * 3.5, 3);
  for (let e = 0; e < 4; e++) {
    for (let k = 0; k < n; k++) {
      let g;
      if (e === 0) g = k;
      else if (e === 1) g = (n - 1) * n + k;
      else if (e === 2) g = k * n;
      else g = k * n + (n - 1);
      const s = g * VSTRIDE;
      for (let c = 0; c < VSTRIDE; c++) verts[p + c] = verts[s + c];
      verts[p + 1] -= drop;
      p += VSTRIDE;
    }
  }
  return { verts, minY, maxY };
}

const chunks = new Map();
const buildQueue = [];
const queued = new Set();
let frameNo = 0;
const ckey = (s, x, z) => s + ':' + x + ':' + z;

function createChunk(size, ox, oz) {
  const d = buildChunkVerts(size, ox, oz, size <= SHADOW_MAX_SIZE);
  const vao = gl.createVertexArray();
  const vbo = gl.createBuffer();
  gl.bindVertexArray(vao);
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.bufferData(gl.ARRAY_BUFFER, d.verts, gl.STATIC_DRAW);
  const st = VSTRIDE * 4;
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, st, 0);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, st, 12);
  gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 1, gl.FLOAT, false, st, 24);
  gl.enableVertexAttribArray(3); gl.vertexAttribPointer(3, 1, gl.FLOAT, false, st, 28);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, IBO.buf);
  gl.bindVertexArray(null);
  const c = { vao, vbo, size, ox, oz, minY: d.minY, maxY: d.maxY, used: frameNo };
  chunks.set(ckey(size, ox, oz), c);
  return c;
}

const MAX_CHUNKS = 320;
function evictChunks() {
  if (chunks.size <= MAX_CHUNKS) return;
  const all = [...chunks.entries()].sort((a, b) => a[1].used - b[1].used);
  const kill = chunks.size - MAX_CHUNKS;
  for (let i = 0; i < kill; i++) {
    const [k, c] = all[i];
    if (frameNo - c.used < 3) continue;
    gl.deleteVertexArray(c.vao);
    gl.deleteBuffer(c.vbo);
    chunks.delete(k);
  }
}

const nodes = [];
function nodeDist(px, pz, ox, oz, size) {
  const dx = Math.max(ox - px, 0, px - (ox + size));
  const dz = Math.max(oz - pz, 0, pz - (oz + size));
  return Math.hypot(dx, dz);
}
function subdivide(ox, oz, size, px, pz, fr) {
  const nd = nodeDist(px, pz, ox, oz, size);
  if (nd > FAR_CULL) return;
  if (size > MIN_LEAF && nd < size * SPLIT) {
    const h = size / 2;
    subdivide(ox, oz, h, px, pz, fr);
    subdivide(ox + h, oz, h, px, pz, fr);
    subdivide(ox, oz + h, h, px, pz, fr);
    subdivide(ox + h, oz + h, h, px, pz, fr);
    return;
  }
  if (!aabbInFrustum(fr, ox, Y_MIN, oz, ox + size, Y_MAX, oz + size)) return;
  nodes.push(ox, oz, size, nd);
}
function collectNodes(px, pz, fr) {
  nodes.length = 0;
  const bx = Math.floor(px / ROOT) * ROOT, bz = Math.floor(pz / ROOT) * ROOT;
  for (let j = -1; j <= 1; j++)
    for (let i = -1; i <= 1; i++)
      subdivide(bx + i * ROOT, bz + j * ROOT, ROOT, px, pz, fr);
}

/* nearest cached ancestor, so a not-yet-built node never leaves a hole */
function chunkOrAncestor(size, ox, oz) {
  let s = size, x = ox, z = oz;
  for (let i = 0; i < 7; i++) {
    const c = chunks.get(ckey(s, x, z));
    if (c) return c;
    s *= 2;
    x = Math.floor(x / s) * s;
    z = Math.floor(z / s) * s;
    if (s > ROOT) break;
  }
  return null;
}

let pendingCount = 0;
function updateTerrain(px, pz, fr, budgetMs) {
  collectNodes(px, pz, fr);
  buildQueue.length = 0;
  queued.clear();
  for (let i = 0; i < nodes.length; i += 4) {
    const ox = nodes[i], oz = nodes[i + 1], size = nodes[i + 2], nd = nodes[i + 3];
    const k = ckey(size, ox, oz);
    const c = chunks.get(k);
    if (c) { c.used = frameNo; continue; }
    if (!queued.has(k)) { queued.add(k); buildQueue.push({ size, ox, oz, nd }); }
  }
  pendingCount = buildQueue.length;
  if (pendingCount) {
    buildQueue.sort((a, b) => a.nd - b.nd);
    const t0 = performance.now();
    for (let i = 0; i < buildQueue.length; i++) {
      const b = buildQueue[i];
      createChunk(b.size, b.ox, b.oz);
      pendingCount--;
      if (performance.now() - t0 > budgetMs) break;
    }
  }
  evictChunks();
}

const drawnKeys = new Set();
function drawTerrain(viewProj, camPos) {
  bindCommon(P.terrain, viewProj, camPos);
  if (P.terrain.u.uTrackTex) {
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, track.tex[track.cur]);
    gl.uniform1i(P.terrain.u.uTrackTex, 0);
    gl.uniform2f(P.terrain.u.uTrackOrigin, track.origin.x, track.origin.z);
    gl.uniform1f(P.terrain.u.uTrackSpan, TRACK_SPAN);
    gl.uniform1f(P.terrain.u.uTrackTexel, 1 / TRACK_RES);
    gl.uniform1f(P.terrain.u.uTrackFade, TRACK_SPAN * 0.30);
  }
  gl.disable(gl.CULL_FACE);
  drawnKeys.clear();
  let calls = 0;
  for (let i = 0; i < nodes.length; i += 4) {
    const c = chunkOrAncestor(nodes[i + 2], nodes[i], nodes[i + 1]);
    if (!c) continue;
    const k = ckey(c.size, c.ox, c.oz);
    if (drawnKeys.has(k)) continue;
    drawnKeys.add(k);
    c.used = frameNo;
    gl.uniform3f(P.terrain.u.uOrigin, c.ox, 0, c.oz);
    gl.bindVertexArray(c.vao);
    gl.drawElements(gl.TRIANGLES, IBO.count, gl.UNSIGNED_SHORT, 0);
    calls++;
  }
  gl.bindVertexArray(null);
  gl.enable(gl.CULL_FACE);
  return calls;
}

/* ------------------------------------------------ 4 meshes + landmarks -- */
function MB() { this.a = []; }
MB.prototype.tri = function (p0, p1, p2, col) {
  const ux = p1[0] - p0[0], uy = p1[1] - p0[1], uz = p1[2] - p0[2];
  const vx = p2[0] - p0[0], vy = p2[1] - p0[1], vz = p2[2] - p0[2];
  let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
  const l = Math.hypot(nx, ny, nz);
  if (l < 1e-9) return;
  nx /= l; ny /= l; nz /= l;
  const a = this.a;
  const ps = [p0, p1, p2];
  for (let i = 0; i < 3; i++) a.push(ps[i][0], ps[i][1], ps[i][2], nx, ny, nz, col[0], col[1], col[2]);
};
MB.prototype.quad = function (p0, p1, p2, p3, col) { this.tri(p0, p1, p2, col); this.tri(p0, p2, p3, col); };
MB.prototype.box = function (c, s, rotY, col) {
  const hx = s[0] / 2, hy = s[1] / 2, hz = s[2] / 2;
  const cs = Math.cos(rotY), sn = Math.sin(rotY);
  const P8 = [];
  for (let i = 0; i < 8; i++) {
    const x = (i & 1 ? hx : -hx), y = (i & 2 ? hy : -hy), z = (i & 4 ? hz : -hz);
    P8.push([c[0] + x * cs + z * sn, c[1] + y, c[2] - x * sn + z * cs]);
  }
  const b = (i) => P8[i];
  this.quad(b(4), b(5), b(7), b(6), col);   // +Z
  this.quad(b(1), b(0), b(2), b(3), col);   // -Z
  this.quad(b(5), b(1), b(3), b(7), col);   // +X
  this.quad(b(0), b(4), b(6), b(2), col);   // -X
  this.quad(b(6), b(7), b(3), b(2), col);   // +Y
  this.quad(b(0), b(1), b(5), b(4), col);   // -Y
};
/* cylinder with its axis along X */
MB.prototype.cylX = function (c, r, halfW, segs, col, capCol) {
  const pt = (side, i) => {
    const t = 2 * Math.PI * (i % segs) / segs;
    return [c[0] + side * halfW, c[1] + Math.cos(t) * r, c[2] + Math.sin(t) * r];
  };
  for (let i = 0; i < segs; i++) {
    this.quad(pt(1, i), pt(-1, i), pt(-1, i + 1), pt(1, i + 1), col);
    this.tri([c[0] + halfW, c[1], c[2]], pt(1, i), pt(1, i + 1), capCol || col);
    this.tri([c[0] - halfW, c[1], c[2]], pt(-1, i + 1), pt(-1, i), capCol || col);
  }
};
/* cylinder with its axis along Z */
MB.prototype.cylZ = function (c, r, halfW, segs, col, capCol) {
  const pt = (side, i) => {
    const t = 2 * Math.PI * (i % segs) / segs;
    return [c[0] + Math.cos(t) * r, c[1] + Math.sin(t) * r, c[2] + side * halfW];
  };
  for (let i = 0; i < segs; i++) {
    this.quad(pt(1, i), pt(-1, i), pt(-1, i + 1), pt(1, i + 1), col);
    this.tri([c[0], c[1], c[2] + halfW], pt(1, i), pt(1, i + 1), capCol || col);
    this.tri([c[0], c[1], c[2] - halfW], pt(-1, i + 1), pt(-1, i), capCol || col);
  }
};
MB.prototype.upload = function () {
  const data = new Float32Array(this.a);
  const vao = gl.createVertexArray(), vbo = gl.createBuffer();
  gl.bindVertexArray(vao);
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 36, 0);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 36, 12);
  gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 3, gl.FLOAT, false, 36, 24);
  gl.bindVertexArray(null);
  /* keep the CPU copy: the body gets dented in place when it is crashed */
  return { vao, vbo, count: data.length / 9, data };
};
/* same mesh, plus a per-instance stream at locations 3 and 4 */
MB.prototype.uploadInstanced = function (maxInst) {
  const m = this.upload();
  const ibuf = gl.createBuffer();
  gl.bindVertexArray(m.vao);
  gl.bindBuffer(gl.ARRAY_BUFFER, ibuf);
  gl.bufferData(gl.ARRAY_BUFFER, maxInst * 8 * 4, gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(3); gl.vertexAttribPointer(3, 4, gl.FLOAT, false, 32, 0); gl.vertexAttribDivisor(3, 1);
  gl.enableVertexAttribArray(4); gl.vertexAttribPointer(4, 4, gl.FLOAT, false, 32, 16); gl.vertexAttribDivisor(4, 1);
  gl.bindVertexArray(null);
  m.ibuf = ibuf;
  m.data = new Float32Array(maxInst * 8);
  m.inst = 0;
  m.max = maxInst;
  m.flush = function () {
    gl.bindBuffer(gl.ARRAY_BUFFER, this.ibuf);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, this.data.subarray(0, this.inst * 8));
  };
  return m;
};

/* SKM1: int16 positions x scale, int8 normals, uint8 colour — unpacked into
   the same interleaved pos/normal/colour layout MB.upload() produces. */
function decodePacked(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const dv = new DataView(bytes.buffer);
  if (String.fromCharCode(bytes[0], bytes[1], bytes[2], bytes[3]) !== 'SKM1') throw new Error('bad model blob');
  const verts = dv.getUint32(4, true) * 3, s = dv.getFloat32(8, true);
  const out = new Float32Array(verts * 9);
  let o = 12;
  for (let i = 0; i < verts; i++) {
    const b = i * 9;
    out[b] = dv.getInt16(o, true) * s;
    out[b + 1] = dv.getInt16(o + 2, true) * s;
    out[b + 2] = dv.getInt16(o + 4, true) * s;
    out[b + 3] = dv.getInt8(o + 6) / 127;
    out[b + 4] = dv.getInt8(o + 7) / 127;
    out[b + 5] = dv.getInt8(o + 8) / 127;
    out[b + 6] = bytes[o + 9] / 255;
    out[b + 7] = bytes[o + 10] / 255;
    out[b + 8] = bytes[o + 11] / 255;
    o += 12;
  }
  return out;
}

  const data = decodePacked(b64);
  const vao = gl.createVertexArray(), vbo = gl.createBuffer();
  gl.bindVertexArray(vao);
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 36, 0);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 36, 12);
  gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 3, gl.FLOAT, false, 36, 24);
  gl.bindVertexArray(null);
  /* keep the CPU copy: the body gets dented in place when it is crashed */
  return { vao, vbo, count: data.length / 9, data };
}

/* ---- rock: low-poly displaced sphere, flat shaded ---- */
function rockMesh(seedOff) {
  const mb = new MB();
  const segs = 9, rings = 6;
  const disp = (r, s) => 0.66 + 0.52 * hash2(r * 71 + seedOff, (s % segs) * 37 + seedOff * 3);
  const P = [];
  for (let r = 0; r <= rings; r++) {
    const phi = Math.PI * r / rings;
    const row = [];
    for (let s = 0; s <= segs; s++) {
      const th = 2 * Math.PI * s / segs;
      const d = (r === 0 || r === rings) ? disp(r, 0) : disp(r, s);
      row.push([
        Math.sin(phi) * Math.cos(th) * d,
        Math.cos(phi) * d * 0.80,
        Math.sin(phi) * Math.sin(th) * d
      ]);
    }
    P.push(row);
  }
  for (let r = 0; r < rings; r++) {
    for (let s = 0; s < segs; s++) {
      const t = 0.30 + 0.16 * hash2(r * 13 + s * 7 + seedOff, s * 29 + seedOff);
      const col = [t * 1.38, t * 1.10, t * 0.86];
      mb.quad(P[r][s], P[r + 1][s], P[r + 1][s + 1], P[r][s + 1], col);
    }
  }
  return mb;
}

/* ---- wreck: half-buried structure ---- */
function wreckMesh() {

/* cylinder about Y, for barrels and cactus limbs */
MB.prototype.cylY = function (c, r, halfH, segs, col, capCol) {
  const pt = (side, i) => {
    const t = 2 * Math.PI * (i % segs) / segs;
    return [c[0] + Math.cos(t) * r, c[1] + side * halfH, c[2] + Math.sin(t) * r];
  };
  for (let i = 0; i < segs; i++) {
    this.quad(pt(1, i), pt(1, i + 1), pt(-1, i + 1), pt(-1, i), col);
    this.tri([c[0], c[1] + halfH, c[2]], pt(1, i + 1), pt(1, i), capCol || col);
    this.tri([c[0], c[1] - halfH, c[2]], pt(-1, i), pt(-1, i + 1), capCol || col);
  }
};

/* ---- saguaro: the one from the cover art ---- */
function cactusMesh(seedOff) {
  const mb = new MB();
  const skin = [0.105, 0.165, 0.085], skinTop = [0.13, 0.20, 0.10];
  const H = 2.2 + hash2(seedOff, 7) * 1.0;                    /* trunk height */
  mb.cylY([0, H / 2, 0], 0.26, H / 2, 9, skin, skinTop);
  const arms = hash2(seedOff * 3, 11) > 0.35 ? 2 : 1;
  for (let a = 0; a < arms; a++) {
    const side = a === 0 ? 1 : -1;
    const ay = H * (0.42 + hash2(seedOff + a, 19) * 0.16);     /* elbow height */
    const reach = 0.46 + hash2(seedOff + a * 5, 23) * 0.24;
    const up = 0.70 + hash2(seedOff + a * 9, 29) * 0.55;
    const r = 0.165;
    for (let s = 1; s <= 4; s++)                               /* horizontal run */
      mb.cylY([side * reach * s / 4, ay, 0], r, r, 8, skin, skin);
    mb.cylY([side * reach, ay + up / 2, 0], r, up / 2, 8, skin, skinTop);   /* riser */
  }
  return mb;
}

}

/* ---- seeded scatter of rocks + pebbles around the camera ---- */
const scatter = { cx: 1e9, cz: 1e9 };
const _scatN = v3();
const rockColliders = [];
function updateScatter(px, pz) {
  const CELL = 190;
  const cx = Math.floor(px / CELL), cz = Math.floor(pz / CELL);
  if (cx === scatter.cx && cz === scatter.cz) return;
  scatter.cx = cx; scatter.cz = cz;
  rockColliders.length = 0;
  MESH.rockA.inst = 0; MESH.rockB.inst = 0;
  const push = (m, x, y, z, s, rot, tint, ys) => {
    if (m.inst >= m.max) return;
    const o = m.inst * 8;
    m.data[o] = x; m.data[o + 1] = y; m.data[o + 2] = z; m.data[o + 3] = s;
    m.data[o + 4] = rot; m.data[o + 5] = tint; m.data[o + 6] = ys; m.data[o + 7] = 0;
    m.inst++;
  };
  const m0 = h => (h > 0.5 ? MESH.rockA : MESH.rockB);
  const R = 7;
  for (let j = -R; j <= R; j++) {
    for (let i = -R; i <= R; i++) {
      const gx = cx + i, gz = cz + j;
      const ox = gx * CELL, oz = gz * CELL;
      if (Math.hypot(ox + CELL / 2 - px, oz + CELL / 2 - pz) > FAR_CULL) continue;
      const seed = hash2(gx * 3 + 91, gz * 5 - 13);
      /* rock formations cluster: 0-4 boulders */
      const n = seed > 0.72 ? 4 : (seed > 0.48 ? 2 : (seed > 0.34 ? 1 : 0));
      for (let k = 0; k < n; k++) {
        const h1 = hash2(gx * 17 + k, gz * 23 + k * 7);
        const h2 = hash2(gx * 29 - k * 3, gz * 11 + k);
        const h3 = hash2(gx * 7 + k * 13, gz * 19 - k);
        const x = ox + h1 * CELL, z = oz + h2 * CELL;
        if (roadness(x, z) > 0.2) continue;
        const s = 1.5 + h3 * 4.2;
        normalAt(_scatN, x, z, Math.max(1.5, s));
        if (_scatN.y < 0.965) continue;
        const ys = s * (0.85 + h3 * 0.4);
        const ry = heightAt(x, z) - ys * 0.30;
        push(m0(h3), x, ry, z, s, h1 * 6.28, 0.95 + h2 * 0.4, ys);
        /* boulders are solid — but only bother with the ones you could reach */
        if (Math.hypot(x - px, z - pz) < 300)
          rockColliders.push({ x, y: ry + ys * 0.25, z, r: s * 0.82, kind: HARD });
      }
      /* pebbles for near-field scale */
      if (Math.hypot(ox - px, oz - pz) < 420) {
        for (let k = 0; k < 6; k++) {
          const h1 = hash2(gx * 53 + k * 31, gz * 61 + k * 3);
          const h2 = hash2(gx * 43 - k * 7, gz * 71 + k * 19);
          const x = ox + h1 * CELL, z = oz + h2 * CELL;
          const s = 0.20 + h1 * 0.55;
          push(MESH.rockB, x, heightAt(x, z) - s * 0.22, z, s, h2 * 6.28, 1.0 + h1 * 0.3, s * 0.9);
        }
      }
    }
  }
  MESH.rockA.flush(); MESH.rockB.flush();
}

/* ------------------------------- 4b solid props: things you hit --------- */
/* Every obstacle is approximated as one or more spheres. Crude, but the car is
   an oriented box and box-vs-sphere gives an exact closest point, a penetration
   depth and a normal in a dozen lines — which is all an impulse needs. */
const HARD = 0, SOFT = 1;
const colliders = [];                    /* static, rebuilt when the cell changes */

let propsDirty = false;                  /* something broke — rebuild the instances */

/* fixed hand-placed props, always in the world */
const LANDMARK_PROPS = [
  /* a drum stack parked on the road shoulder, north of the spawn */
  { kind: 'drumstack', x: null, z: 1740, n: 9 },
  /* somebody left a hat on a cactus out past the first wreck */
  { kind: 'hatcactus', x: 452, z: 812 }

LANDMARK_PROPS[0].x = roadCenterX(1740) + 15;

const drums = [];                        /* dynamic, knockable */
const DRUM_R = 0.46, DRUM_M = 55;
function spawnDrum(x, z, id) {
  const y = heightAt(x, z) + 0.45;
  drums.push({ id, hx: x, hy: y, hz: z, x, y, z, vx: 0, vy: 0, vz: 0,
               rot: hash2(id, 3) * 6.283, tilt: 0, tiltAx: 0, rest: 1 });
}

const propCell = { cx: 1e9, cz: 1e9 };
const _pn = v3();
function updateProps(px, pz) {
  const CELL = 190;
  const cx = Math.floor(px / CELL), cz = Math.floor(pz / CELL);
  if (cx === propCell.cx && cz === propCell.cz && !propsDirty) return;
  propCell.cx = cx; propCell.cz = cz;
  propsDirty = false;

  colliders.length = 0;
  MESH.cactusA.inst = 0; MESH.cactusB.inst = 0; MESH.hat.inst = 0;
  const seen = new Set();

  const pushInst = (m, x, y, z, s, rot, tint, ys) => {
    if (m.inst >= m.max) return;
    const o = m.inst * 8;
    m.data[o] = x; m.data[o + 1] = y; m.data[o + 2] = z; m.data[o + 3] = s;
    m.data[o + 4] = rot; m.data[o + 5] = tint; m.data[o + 6] = ys; m.data[o + 7] = 0;
    m.inst++;
  };

  const R = 3;
  for (let j = -R; j <= R; j++) {
    for (let i = -R; i <= R; i++) {
      const gx = cx + i, gz = cz + j;
      const ox = gx * CELL, oz = gz * CELL;

      /* saguaros — the ones off the cover art */
      const nc = Math.floor(hash2(gx * 13 + 5, gz * 17 - 3) * 5);
      for (let k = 0; k < nc; k++) {
        const h1 = hash2(gx * 31 + k * 3, gz * 37 + k);
        const h2 = hash2(gx * 41 - k, gz * 43 + k * 7);
        const x = ox + h1 * CELL, z = oz + h2 * CELL;
        if (roadness(x, z) > 0.15) continue;
        normalAt(_pn, x, z, 3);
        if (_pn.y < 0.985) continue;                 /* they grow on flat ground */
        const id = 'c' + gx + ',' + gz + ',' + k;
        if (brokenProps.has(id)) continue;          /* you already flattened this one */
        const s = 0.85 + hash2(gx + k, gz - k) * 0.5;
        const y = heightAt(x, z) - 0.15;
        pushInst(h1 > 0.5 ? MESH.cactusA : MESH.cactusB, x, y, z, s, h2 * 6.283, 0.9 + h1 * 0.3, s);
        /* one sphere at bumper height is what actually matters */
        colliders.push({ x, y: y + 0.95 * s, z, r: 0.5 * s, kind: SOFT, id });
      }

      /* drum clusters, rare, and only where a road crew might have left them */
      if (hash2(gx * 7 - 21, gz * 11 + 9) > 0.87) {
        const n = 3 + Math.floor(hash2(gx, gz) * 4);
        for (let k = 0; k < n; k++) {
          const h1 = hash2(gx * 61 + k * 13, gz * 67 + k);
          const h2 = hash2(gx * 71 - k * 5, gz * 73 + k * 3);
          const x = ox + h1 * CELL, z = oz + h2 * CELL;

  for (const s of WRECK_SITES) {
