    for (const lx of [-4.2, 4.2])
      for (const lz of [-8, -4, 0, 4, 8]) post(lx, lz, 5.8, 0.34);
    post(-4.6, -2, 4.25, 0.5);                  /* fallen wall */
    post(-4.6, 3.5, 4.25, 0.5);
    post(-7.5, 6.0, 1.4, 0.8);                  /* crates */
    post(-6.2, 8.2, 1.2, 0.7);
    post(6.5, -6.5, 3.2, 0.55);                 /* stub tower */
  }

  /* hand-placed props */
  for (const p of LANDMARK_PROPS) {
    if (Math.hypot(p.x - px, p.z - pz) > 900) continue;
    if (p.kind === 'drumstack') {
      for (let k = 0; k < p.n; k++) {
        const id = -900000 - k;
        seen.add(id);
        if (!drums.some(d => d.id === id)) {
          const row = Math.floor(k / 3), col = k % 3;
          spawnDrum(p.x + col * 0.95 - 0.95, p.z + row * 0.95, id);
          const d = drums[drums.length - 1];
          d.y = heightAt(d.x, d.z) + 0.45 + row * 0.02;
        }
      }
    } else if (p.kind === 'hatcactus') {
      const y = heightAt(p.x, p.z) - 0.15;
      const s = 1.25;
      pushInst(MESH.cactusA, p.x, y, p.z, s, 0.7, 1.05, s);
      colliders.push({ x: p.x, y: y + 0.95 * s, z: p.z, r: 0.5 * s, kind: SOFT });
      /* the trunk of cactusA is 2.2 + hash2(5,7)*1.0 tall before scaling */
      const trunk = (2.2 + hash2(5, 7) * 1.0) * s;
      pushInst(MESH.hat, p.x, y + trunk - 0.03, p.z, 1, 0.35, 1, 1);
    }
  }

  /* drop drums that have been left far behind */
  for (let i = drums.length - 1; i >= 0; i--)
    if (!seen.has(drums[i].id) && Math.hypot(drums[i].x - px, drums[i].z - pz) > 700) drums.splice(i, 1);

  MESH.cactusA.flush(); MESH.cactusB.flush(); MESH.hat.flush();
}

/* --------------------------------------------- impacts and damage ------- */
/* the body as an oriented box, in body space */
const CAR_BOX = { cy: 0.50, hx: 0.98, hy: 0.76, hz: 2.30 };
const crash = { damage: 0, shake: 0, lastHit: 0, hits: 0, worst: 0, pull: 0 };

/* impulse for a contact at world point `cp` with outward normal `n`.
   Returns the normal impulse magnitude. */
const _ir = v3(), _irn = v3(), _iw = v3(), _it = v3();
/* A saguaro cannot stop two tonnes. Capping the normal impulse models the
   plant yielding: below the cap it resists, above it the stem snaps and the
   truck keeps most of its speed. 3800 N·s costs about 4 mph. */
const SOFT_YIELD = 3800;
function applyImpact(cp, n, vn, restitution, invMassOther, maxJ) {
  vsub(_ir, cp, car.p);
  vcross(_irn, _ir, n);
  qrotInv(_iw, car.q, _irn);
  vset(_iw, _iw.x / CARP.Ixx, _iw.y / CARP.Iyy, _iw.z / CARP.Izz);
  qrot(_iw, car.q, _iw);
  vcross(_it, _iw, _ir);
  const invEff = 1 / CARP.mass + vdot(_it, n) + (invMassOther || 0);
  let j = -(1 + restitution) * vn / Math.max(invEff, 1e-6);
  if (maxJ && j > maxJ) j = maxJ;
  vaddScaled(car.v, car.v, n, j / CARP.mass);
  vcross(_irn, _ir, n);
  qrotInv(_iw, car.q, _irn);
  vset(_iw, _iw.x / CARP.Ixx, _iw.y / CARP.Iyy, _iw.z / CARP.Izz);
  qrot(_iw, car.q, _iw);
  vaddScaled(car.w, car.w, _iw, j);
  return j;
}

/* closest point on the car box to a world point; fills _hitP with the world
   contact and _cn with the world normal pointing away from the box */
function carClosest(wx, wy, wz) {
  vset(_ci, wx - car.p.x, wy - car.p.y, wz - car.p.z);
  qrotInv(_cj, car.q, _ci);                              /* into body space */
  const lx = clamp(_cj.x, -CAR_BOX.hx, CAR_BOX.hx);
  const ly = clamp(_cj.y, CAR_BOX.cy - CAR_BOX.hy, CAR_BOX.cy + CAR_BOX.hy);
  const lz = clamp(_cj.z, -CAR_BOX.hz, CAR_BOX.hz);
  const dx = _cj.x - lx, dy = _cj.y - ly, dz = _cj.z - lz;
  const dist = Math.hypot(dx, dy, dz);
  vset(_ci, lx, ly, lz);
  qrot(_hitP, car.q, _ci);
  vadd(_hitP, car.p, _hitP);                                 /* contact, world */
  if (dist > 1e-5) { vset(_ci, dx / dist, dy / dist, dz / dist); qrot(_cn, car.q, _ci); }
  else { vset(_cn, 0, 1, 0); }                           /* centre inside: bail upward */
  return dist;
}

const _cv = v3(), _cd = v3();
function collideProps(dt) {
  const sp = vlen(car.v);
  const sets = [colliders, rockColliders];
  for (let s = 0; s < 2; s++) for (let i = 0; i < sets[s].length; i++) {
    const c = sets[s][i];
    if (c.id && brokenProps.has(c.id)) continue;
    if (Math.abs(c.x - car.p.x) > 8 || Math.abs(c.z - car.p.z) > 8) continue;
    const dist = carClosest(c.x, c.y, c.z);
    const pen = c.r - dist;
    if (pen <= 0) continue;

    /* normal points from the obstacle towards the car */
    vscale(_cn, _cn, -1);
    vsub(_cr, _hitP, car.p);
    vcross(_cv, car.w, _cr);
    vadd(_cv, car.v, _cv);
    const vn = vdot(_cv, _cn);
    const soft = c.kind === SOFT;
    /* Hit a saguaro hard enough and the stem snaps: it stops colliding and
       stops being drawn. Without this the capped impulse just re-fires every
       substep and the "soft" prop stops the truck by attrition. */
    if (soft && c.id && -vn > 4) {
      brokenProps.add(c.id);
      propsDirty = true;
      for (let n = 0; n < 14; n++) {
        const jt = () => (Math.random() - 0.5) * 2;
        spawnDust(c.x + jt() * 0.5, c.y + jt() * 0.9, c.z + jt() * 0.5,
          car.v.x * 0.2 + jt() * 3.5, 1.5 + Math.random() * 2.5, car.v.z * 0.2 + jt() * 3.5,
          0.8 + Math.random(), 24 + Math.random() * 30);
      }
    }
    if (vn < 0) {
      const j = applyImpact(_hitP, _cn, vn, soft ? 0.05 : 0.18, 0, soft ? SOFT_YIELD : 0);
      /* lateral scrub, so glancing blows drag rather than slide free */
      vaddScaled(_cd, _cv, _cn, -vn);
      const tl = vlen(_cd);
      if (tl > 0.05) {
        vscale(_cd, _cd, -1 / tl);
        vaddScaled(car.v, car.v, _cd, Math.min(tl, j * (soft ? 0.25 : 0.55) / CARP.mass));
      }
      registerHit(_hitP, _cn, -vn, soft ? 0.25 : 1);
    }
    /* Push out so it does not jitter at rest — but a snapped saguaro must not
       also shove the truck aside, so drop the correction once you are through
       it fast enough to have broken it. */
    const push = soft ? (-vn > 4 ? 0 : 0.35) : 0.7;
    if (push) vaddScaled(car.p, car.p, _cn, Math.max(0, pen - 0.02) * push);
  }

  /* drums: light enough that the car mostly wins */
  for (const d of drums) {
    if (Math.abs(d.x - car.p.x) > 9 || Math.abs(d.z - car.p.z) > 9) continue;
    const dist = carClosest(d.x, d.y, d.z);
    const pen = DRUM_R - dist;
    if (pen <= 0) continue;
    vscale(_cn, _cn, -1);
    vsub(_cr, _hitP, car.p);
    vcross(_cv, car.w, _cr);
    vadd(_cv, car.v, _cv);
    _cv.x -= d.vx; _cv.y -= d.vy; _cv.z -= d.vz;
    const vn = vdot(_cv, _cn);
    if (vn < 0) {
      const j = applyImpact(_hitP, _cn, vn, 0.35, 1 / DRUM_M);
      d.vx -= _cn.x * j / DRUM_M; d.vy -= _cn.y * j / DRUM_M - 1.2; d.vz -= _cn.z * j / DRUM_M;
      d.tiltAx = Math.atan2(_cn.x, _cn.z);
      d.rest = 0;
      registerHit(_hitP, _cn, -vn, 0.12);
    }
    vaddScaled(car.p, car.p, _cn, Math.max(0, pen - 0.02) * 0.12);
    d.x -= _cn.x * pen * 0.6; d.z -= _cn.z * pen * 0.6;
  }
  if (sp > 2) crash.shake = Math.max(0, crash.shake - dt * 2.2);
  else crash.shake = Math.max(0, crash.shake - dt * 4);
}

function updateDrums(dt) {
  for (const d of drums) {
    if (d.rest && Math.abs(d.x - car.p.x) > 12) continue;
    d.vy -= 9.81 * dt;
    d.x += d.vx * dt; d.y += d.vy * dt; d.z += d.vz * dt;
    const g = heightAt(d.x, d.z) + DRUM_R * 0.62;
    if (d.y < g) {
      d.y = g;
      if (d.vy < 0) d.vy *= -0.22;
      const f = Math.exp(-3.2 * dt);
      d.vx *= f; d.vz *= f;
      d.tilt *= Math.exp(-2.0 * dt);
      if (Math.hypot(d.vx, d.vz) < 0.25 && Math.abs(d.vy) < 0.5) { d.rest = 1; d.vx = d.vy = d.vz = 0; }
    } else {
      d.rest = 0;
      d.tilt = Math.min(1.35, d.tilt + Math.hypot(d.vx, d.vz) * dt * 1.4);
    }
    d.rot += (d.vx + d.vz) * dt * 0.6;
  }
  /* upload what is near enough to see */
  const m = MESH.drum;
  m.inst = 0;
  for (const d of drums) {
    if (m.inst >= m.max) break;
    if (Math.hypot(d.x - cam.p.x, d.z - cam.p.z) > 420) continue;
    const o = m.inst * 8;
    m.data[o] = d.x; m.data[o + 1] = d.y; m.data[o + 2] = d.z; m.data[o + 3] = 1;
    /* the drum is radially symmetric, so its yaw is free to carry the tilt
       axis — that is what points the tip in the direction it was hit */
    m.data[o + 4] = d.tiltAx; m.data[o + 5] = 1; m.data[o + 6] = 1; m.data[o + 7] = d.tilt;
    m.inst++;
  }
  m.flush();
}

/* ---- what a hit does: shake, dust, damage, and a dent in the panel ---- */
function registerHit(cp, n, speed, severity) {
  if (speed < 1.2) return;
  const energy = 0.5 * CARP.mass * speed * speed * severity;
  const norm = Math.min(1, energy / 260000);
  crash.shake = Math.min(1.4, crash.shake + norm * 1.5);
  crash.hits++;
  crash.worst = Math.max(crash.worst, norm);
  crash.damage = Math.min(1, crash.damage + norm * 0.55);
  crash.lastHit = performance.now();
  /* a front-corner hit on one side bends the steering that way */
  qrotInv(_dn, car.q, n);
  if (_dn.z < -0.25) crash.pull = clamp(crash.pull - Math.sign(_dn.x) * norm * 0.06, -0.09, 0.09);
  for (let i = 0; i < Math.min(18, 3 + norm * 26); i++) {
    const j = () => (Math.random() - 0.5) * 2;
    spawnDust(cp.x + j() * 0.4, cp.y + j() * 0.4, cp.z + j() * 0.4,
      n.x * speed * 0.25 + j() * 3, 1.2 + Math.random() * 2.2, n.z * speed * 0.25 + j() * 3,
      0.7 + Math.random() * 0.9, 22 + Math.random() * 30);
  }
  if (norm > 0.045) dentCar(cp, n, Math.min(0.34, 0.10 + norm * 0.5), 0.5 + norm * 1.1);
  if (audio.ctx && audio.on) crashSound(Math.min(1, norm * 2.2));
}

/* push the panel in around the impact and rebuild the flat normals there */
const _dp = v3(), _dn = v3();
function dentCar(cp, n, depth, radius) {
  const m = MESH.car;
  if (!m || !m.data) return;
  vsub(_dp, cp, car.p);
  qrotInv(_dp, car.q, _dp);                 /* impact point, body space */
  qrotInv(_dn, car.q, n);                   /* and direction */
  const d = m.data, r2 = radius * radius;
  let touched = false;
  for (let i = 0; i < d.length; i += 9) {
    const dx = d[i] - _dp.x, dy = d[i + 1] - _dp.y, dz = d[i + 2] - _dp.z;
    const q = dx * dx + dy * dy + dz * dz;
    if (q > r2) continue;
    const f = (1 - Math.sqrt(q) / radius);
    const k = f * f * depth;
    d[i] += _dn.x * k; d[i + 1] += _dn.y * k; d[i + 2] += _dn.z * k;
    touched = true;
  }
  if (!touched) return;
  /* non-indexed soup: recompute the normal of any triangle that moved */
  for (let t = 0; t < d.length; t += 27) {
    const ax = d[t], ay = d[t + 1], az = d[t + 2];
    if (Math.abs(ax - _dp.x) > radius + 1 && Math.abs(az - _dp.z) > radius + 1) continue;
    const ux = d[t + 9] - ax, uy = d[t + 10] - ay, uz = d[t + 11] - az;
    const vx = d[t + 18] - ax, vy = d[t + 19] - ay, vz = d[t + 20] - az;
    let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
    const l = Math.hypot(nx, ny, nz) || 1;
    nx /= l; ny /= l; nz /= l;
    for (let k = 0; k < 3; k++) { d[t + k * 9 + 3] = nx; d[t + k * 9 + 4] = ny; d[t + k * 9 + 5] = nz; }
  }
  gl.bindBuffer(gl.ARRAY_BUFFER, m.vbo);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, d);
}

function repairCar() {
  crash.damage = 0; crash.hits = 0; crash.worst = 0; crash.shake = 0; crash.pull = 0;
  const m = MESH.car;
  if (m && m.pristine) {
    m.data.set(m.pristine);
    gl.bindBuffer(gl.ARRAY_BUFFER, m.vbo);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, m.data);
  }
}

/* ---- pylon line beside the road, with wire ---- */
const PYLON_SPACING = 96, PYLON_OFF = 33;
const cableBuf = gl.createBuffer();
const cableVao = gl.createVertexArray();
gl.bindVertexArray(cableVao);
gl.bindBuffer(gl.ARRAY_BUFFER, cableBuf);
gl.bufferData(gl.ARRAY_BUFFER, 4 * 3 * 4 * 64, gl.DYNAMIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 12, 0);
gl.bindVertexArray(null);
const cableData = new Float32Array(3 * 4 * 64);
let cableVerts = 0;
const pylonState = { k: 1e9 };
function updatePylons(px, pz) {
  const k = Math.round(pz / PYLON_SPACING);
  if (k === pylonState.k) return;
  pylonState.k = k;
  MESH.pylon.inst = 0;
  cableVerts = 0;
  let prev = null;
  for (let i = -13; i <= 13; i++) {
    const idx = k + i;
    const z = idx * PYLON_SPACING;
    const x = roadCenterX(z) + PYLON_OFF;
    const y = heightAt(x, z);
    const lean = (hash2(idx, 7) - 0.5) * 0.28;
    if (MESH.pylon.inst < MESH.pylon.max) {
      const o = MESH.pylon.inst * 8;
      MESH.pylon.data[o] = x; MESH.pylon.data[o + 1] = y - 0.6; MESH.pylon.data[o + 2] = z;
      MESH.pylon.data[o + 3] = 1; MESH.pylon.data[o + 4] = lean; MESH.pylon.data[o + 5] = 0.9 + hash2(idx, 3) * 0.3;
      MESH.pylon.data[o + 6] = 0.85 + hash2(idx, 11) * 0.3; MESH.pylon.data[o + 7] = 0;
      MESH.pylon.inst++;
    }
    const top = { x: x, y: y - 0.6 + 7.6 * (0.85 + hash2(idx, 11) * 0.3), z: z };
    if (prev && cableVerts + 8 <= 4 * 64) {
      for (let s = 0; s < 4; s++) {
        const t0 = s / 4, t1 = (s + 1) / 4;
        const pt = (t) => {
          const sag = Math.sin(Math.PI * t) * 2.1;
          return [prev.x + (top.x - prev.x) * t, prev.y + (top.y - prev.y) * t - sag, prev.z + (top.z - prev.z) * t];
        };
        const a = pt(t0), b = pt(t1);
        cableData[cableVerts * 3] = a[0]; cableData[cableVerts * 3 + 1] = a[1]; cableData[cableVerts * 3 + 2] = a[2];
        cableVerts++;
        cableData[cableVerts * 3] = b[0]; cableData[cableVerts * 3 + 1] = b[1]; cableData[cableVerts * 3 + 2] = b[2];
        cableVerts++;
      }
    }
    prev = top;
  }
  MESH.pylon.flush();
  gl.bindBuffer(gl.ARRAY_BUFFER, cableBuf);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, cableData.subarray(0, cableVerts * 3));
}

/* ---- fixed wreck sites, sunk into the sand ---- */
const WRECK_SITES = [
  { x: 380, z: 900, rot: 0.8 },
  { x: -1150, z: -420, rot: 2.4 },
  { x: 240, z: -1850, rot: 5.1 }
];
(function placeWrecks() {
  const m = MESH.wreck;
  const n = v3();
  for (let i = 0; i < WRECK_SITES.length; i++) {
    const s = WRECK_SITES[i];
    /* nudge onto the flattest ground nearby so it reads as a structure, not debris */
    let bestFlat = -1, bx = s.x, bz = s.z;
    for (let j = -3; j <= 3; j++) {
      for (let k = -3; k <= 3; k++) {
        const x = s.x + j * 55, z = s.z + k * 55;
        normalAt(n, x, z, 8);
        const flat = n.y - Math.hypot(x - s.x, z - s.z) * 0.00012;
        if (flat > bestFlat) { bestFlat = flat; bx = x; bz = z; }
      }
    }
    s.x = bx; s.z = bz;
    /* Sink it relative to the ground it actually stands on. Taking the minimum
       of a ring buried the whole structure whenever the site sat on any slope —
       the ring low point can be metres under the centre. */
    s.y = heightAt(s.x, s.z) - 1.3;
    s.ground = heightAt(s.x, s.z);
    const o = i * 8;
    m.data[o] = s.x; m.data[o + 1] = s.y; m.data[o + 2] = s.z; m.data[o + 3] = 2.1;
    m.data[o + 4] = s.rot; m.data[o + 5] = 1; m.data[o + 6] = 2.1; m.data[o + 7] = 0;
    m.inst++;
  }
  m.flush();
})();

/* ------------------------------------ 5 vehicle: raycast suspension ----- */
const G = 9.81;
/* 4-door body-on-frame truck: 2.1 t, 2.95 m wheelbase, 1.60 m track */
const CARP = {
  mass: 2100,
  Ixx: 4650, Iyy: 4700, Izz: 1250,
  wheelR: FIT.wheelR, susRest: 0.52, susTravel: 0.38,
  k: 36000, damp: 3100, antiRoll: 13000,
  bumpStop: 55000, bumpDamp: 7000, maxLoad: 46000,
  engine: 21500, vMax: 41, brake: 18000,
  maxSteer: 33 * DEG,
  mounts: [
    { x: -FIT.mountX, y: 0.30, z: FIT.mountZ, steer: 1 },
    { x: FIT.mountX, y: 0.30, z: FIT.mountZ, steer: 1 },
    { x: -FIT.mountX, y: 0.30, z: -FIT.mountZ, steer: 0 },
    { x: FIT.mountX, y: 0.30, z: -FIT.mountZ, steer: 0 }
  ]
};
const UP = v3(0, 1, 0), FWD = v3(0, 0, 1), RIGHT = v3(-1, 0, 0);

const car = {
  p: v3(0, 0, 0), v: v3(0, 0, 0), w: v3(0, 0, 0), q: qid(),
  steer: 0, throttle: 0, brake: 0, hand: 0,
  up: v3(0, 1, 0), fwd: v3(0, 0, 1), right: v3(1, 0, 0),
  wheels: CARP.mounts.map(() => ({ comp: 0, prevComp: 0, contact: 0, spin: 0, slip: 0, load: 0, cx: 0, cy: 0, cz: 0 })),
  contacts: 0, flipTimer: 0, surface: 0, grade: 0, slipAvg: 0, airborne: 0
};

const SPAWN_Z = 950, SPAWN_OFFROAD = 88;
/* park on the flattest ground near the spawn — it is the cover shot as well as
   the starting position, and a slip face is a bad place to be either way */
const SPAWN = (() => {
  const cx = roadCenterX(SPAWN_Z) + SPAWN_OFFROAD, n = v3();
  let best = -1, bx = cx, bz = SPAWN_Z;
  for (let j = -4; j <= 4; j++) {
    for (let i = -4; i <= 4; i++) {
      const x = cx + i * 24, z = SPAWN_Z + j * 24;
      if (Math.abs(x - roadCenterX(z)) < 36) continue;      // keep off the graded corridor
      normalAt(n, x, z, 4);
      const score = n.y - Math.hypot(i, j) * 0.005;
      if (score > best) { best = score; bx = x; bz = z; }
    }
  }
  return { x: bx, z: bz };
})();
function resetCar(toRoad) {
  const z = toRoad ? SPAWN.z : car.p.z;
  const x = toRoad ? SPAWN.x : car.p.x;
  car.p.x = x; car.p.z = z;
  car.p.y = heightAt(x, z) + 1.4;
  vset(car.v, 0, 0, 0); vset(car.w, 0, 0, 0);
  car.q = qid();
  if (!toRoad) {
    /* keep heading, drop the roll */
    const yaw = Math.atan2(car.fwd.x, car.fwd.z);   /* quat yaw, not compass bearing */
    qAxisAngle(car.q, 0, 1, 0, yaw);
  }
  car.flipTimer = 0;
  /* forget where each tyre last marked, so a reset that moves the truck cannot
     draw a rut from where it was to where it now is */
  for (const wl of car.wheels) { wl.comp = 0; wl.prevComp = 0; wl.spin = 0; wl.tx = undefined; }
}

const _mount = v3(), _r = v3(), _rc = v3(), _down = v3(), _pv = v3(), _tmp = v3(), _tmp2 = v3();
const _fw = v3(), _side = v3(), _ng = v3(), _F = v3(), _T = v3(), _acc = v3(), _rr = v3();
const ROLL_CENTRE = -0.42;

function carStep(dt) {
  qrot(car.up, car.q, UP);
  qrot(car.fwd, car.q, FWD);
  qrot(car.right, car.q, RIGHT);

  /* steering: speed sensitive, smoothed */
  const speed = vlen(car.v);
  /* bent steering pulls towards whichever side took the hits */
  const target = car.steerInput * CARP.maxSteer / (1 + speed * 0.038) + crash.pull;
  car.steer += (target - car.steer) * Math.min(1, dt * 9);

  vset(_F, 0, -CARP.mass * G, 0);
  vset(_T, 0, 0, 0);

  const fwdSpeed = vdot(car.v, car.fwd);
  let drive = 0, brakeF = 0;
  if (car.throttle > 0.01) {
    const fade = 1 - Math.pow(clamp(Math.max(fwdSpeed, 0) / CARP.vMax, 0, 1), 1.5);
    /* a beaten-up truck does not make full power */
    drive = car.throttle * CARP.engine * fade * (1 - crash.damage * 0.42);
  }
  if (car.brake > 0.01) {
    if (fwdSpeed > 0.8) brakeF = car.brake * CARP.brake;
    else drive = -car.brake * CARP.engine * 0.42 * (1 - clamp(-fwdSpeed / 14, 0, 1));
  }

  let contacts = 0, slipSum = 0, surf = 0;
  for (let i = 0; i < 4; i++) {
    const m = CARP.mounts[i], wl = car.wheels[i];
    qrot(_r, car.q, vset(_tmp, m.x, m.y, m.z));
    vadd(_mount, car.p, _r);
    vscale(_down, car.up, -1);

    /* near-vertical ray against the analytic field — never touches the mesh */
    let t = Math.max(0, _mount.y - heightAt(_mount.x, _mount.z)) / Math.max(0.25, -_down.y);
    for (let it = 0; it < 3; it++) {
      const hx = _mount.x + _down.x * t, hy = _mount.y + _down.y * t, hz = _mount.z + _down.z * t;
      const g = hy - heightAt(hx, hz);
      t += g / Math.max(0.25, -_down.y);
      if (Math.abs(g) < 0.01) break;
    }
    const maxD = CARP.susRest + CARP.wheelR;
    let comp = maxD - t;
    wl.prevComp = wl.comp;

    if (comp <= 0) {
      wl.comp = 0; wl.contact = 0; wl.load = 0;
      wl.spin *= Math.exp(-0.6 * dt);
      wl.cx = _mount.x + _down.x * CARP.susRest;
      wl.cy = _mount.y + _down.y * CARP.susRest;
      wl.cz = _mount.z + _down.z * CARP.susRest;
      continue;
    }
    contacts++;
    const bottomed = comp > CARP.susTravel;
    comp = Math.min(comp, CARP.susTravel);
    wl.comp = comp;
    wl.contact = 1;

    vaddScaled(_rc, _r, _down, maxD - comp);           // mount->contact, body relative
    vcross(_pv, car.w, _rc);
    vadd(_pv, car.v, _pv);                              // velocity of the contact point

    const vUp = vdot(_pv, car.up);
    /* asymmetric damping: stiffer on rebound, so a hard landing is absorbed
       instead of being stored in the spring and fired back out */
    let load = CARP.k * comp - (vUp < 0 ? CARP.damp : CARP.damp * 2.1) * vUp;
    /* anti-roll bar */
    const other = car.wheels[i ^ 1];
    load += CARP.antiRoll * (comp - other.comp);
    if (bottomed) {
      const pen = Math.min(maxD - t - CARP.susTravel, 0.45);
      load += CARP.bumpStop * pen;
      if (vUp < 0) load -= vUp * CARP.bumpDamp;      /* eat the impact */
    }
    load = clamp(load, 0, CARP.maxLoad);
    wl.load = load;

    vaddScaled(_F, _F, car.up, load);
    vcross(_tmp2, _rc, vscale(_tmp, car.up, load));
    vadd(_T, _T, _tmp2);

    /* tyre frame on the ground plane */
    const cxw = _mount.x + _down.x * t, czw = _mount.z + _down.z * t;
    normalAt(_ng, cxw, czw, 0.5);
    const st = m.steer ? car.steer : 0;
    _tmp.x = car.fwd.x * Math.cos(st) + car.right.x * Math.sin(st);
    _tmp.y = car.fwd.y * Math.cos(st) + car.right.y * Math.sin(st);
    _tmp.z = car.fwd.z * Math.cos(st) + car.right.z * Math.sin(st);
    vaddScaled(_fw, _tmp, _ng, -vdot(_tmp, _ng));
    vnorm(_fw, _fw);
    vnorm(_side, vcross(_side, _ng, _fw));

    const vf = vdot(_pv, _fw), vs = vdot(_pv, _side);
    const road = roadness(cxw, czw);
    surf += road;
    const muLong = mix(1.30, 1.75, road);
    let muLat = mix(1.10, 1.70, road);
    const roll = mix(82, 20, road);

    const rear = i >= 2;
    if (car.hand > 0.5 && rear) muLat *= 0.32;

    let Ff = (rear && car.hand > 0.5 ? 0 : drive * 0.25) - vf * roll - Math.sign(vf) * brakeF * 0.25;
    if (car.hand > 0.5 && rear) Ff -= Math.sign(vf) * 5200;
    if (car.throttle < 0.05 && car.brake < 0.05) {
      /* holds on a slope when parked, light engine braking when coasting */
      const hold = mix(4400, 560, smoothstep(1.2, 2.6, Math.abs(vf)));
      Ff -= Math.sign(vf) * Math.min(Math.abs(vf) * 2400, hold);
    }
    let Fs = -load * clamp(vs * 0.70, -muLat, muLat);

    const lim = load * muLong;
    const mag = Math.hypot(Ff, Fs);
    if (mag > lim && mag > 1e-4) { const s = lim / mag; Ff *= s; Fs *= s; }

    wl.slip = Math.min(1, (Math.abs(vs) * 0.13 + Math.max(0, Math.abs(drive * 0.25) - lim) * 0.0006));
    slipSum += wl.slip;

    _tmp.x = _fw.x * Ff + _side.x * Fs;
    _tmp.y = _fw.y * Ff + _side.y * Fs;
    _tmp.z = _fw.z * Ff + _side.z * Fs;
    vadd(_F, _F, _tmp);
    /* tyre forces act about a roll centre near the hull, not down at the contact
       patch — the arcade fix that keeps hard corners from tipping the buggy */
    vaddScaled(_rr, _rc, car.up, ROLL_CENTRE - vdot(_rc, car.up));
    vcross(_tmp2, _rr, _tmp);
    vadd(_T, _T, _tmp2);

    wl.spin += (vf / CARP.wheelR) * dt;
    wl.cx = _mount.x + _down.x * (CARP.susRest - comp);
    wl.cy = _mount.y + _down.y * (CARP.susRest - comp);
    wl.cz = _mount.z + _down.z * (CARP.susRest - comp);
  }
  car.contacts = contacts;
  car.slipAvg = contacts ? slipSum / contacts : 0;
  car.surface = contacts ? surf / contacts : 0;

  /* aero + airborne self-righting assist */
  const sp = vlen(car.v);
  vaddScaled(_F, _F, car.v, -0.90 * sp);   /* it is a brick */
  if (contacts === 0) {
    vcross(_tmp, car.up, UP);
    vaddScaled(_T, _T, _tmp, 19000);      /* level out for the landing */
    vaddScaled(_T, _T, car.w, -9500);
    car.airborne = Math.min(1, car.airborne + dt * 3);
  } else {
    car.airborne = Math.max(0, car.airborne - dt * 6);
  }

  /* integrate */
  vaddScaled(car.v, car.v, _F, dt / CARP.mass);
  vaddScaled(car.p, car.p, car.v, dt);

  qrotInv(_tmp, car.q, _T);
  vset(_acc, _tmp.x / CARP.Ixx, _tmp.y / CARP.Iyy, _tmp.z / CARP.Izz);
  qrot(_tmp, car.q, _acc);
  vaddScaled(car.w, car.w, _tmp, dt);
  const angDamp = Math.exp(-(contacts ? 1.6 : 0.5) * dt);
  vscale(car.w, car.w, angDamp);
  const wl2 = vlen(car.w);
  if (wl2 > 14) vscale(car.w, car.w, 14 / wl2);
  qIntegrate(car.q, car.w, dt);

  /* things you can hit */
  collideProps(dt);

  /* hard floor guard */
  const gh = heightAt(car.p.x, car.p.z);
  if (car.p.y < gh + 0.12) { car.p.y = gh + 0.12; if (car.v.y < 0) car.v.y *= -0.15; }

  car.grade = 0;
  normalAt(_ng, car.p.x, car.p.z, 1.0);
  car.grade = -vdot(_ng, car.fwd) / Math.max(0.05, _ng.y) * 100;

  if (car.up.y < 0.15 && contacts > 0) {
    car.flipTimer += dt;
    if (car.flipTimer > 1.9) resetCar(false);
  } else car.flipTimer = 0;
}

/* ------------------------------------------- tyre tracks in the sand --- */
/* A single-channel accumulation map anchored to the world, covering TRACK_SPAN
   metres. Wheels stamp into it every frame; the terrain shader samples it to
   flatten the ripples, darken the compacted sand and bend the normal into a
   rut. When the truck drives out of range the map re-anchors and the old
   contents are blitted back at the new offset, so tracks survive scrolling
   instead of being cleared. */
/* 0.156 m per texel — a 0.48 m tyre lands on three texels, which is the least
   that reads as a rut with shoulders rather than as a one-pixel scratch */
const TRACK_RES = 2048, TRACK_SPAN = 320;
const TRACK_TEXEL = TRACK_SPAN / TRACK_RES;
const TRACK_STEP = 20;                          /* re-anchor after this much travel */
const track = {
  origin: { x: 0, z: 0 }, tex: [null, null], fbo: [null, null], cur: 0, ready: false, fadeT: 0
};
(function initTracks() {
  for (let i = 0; i < 2; i++) {
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texStorage2D(gl.TEXTURE_2D, 1, gl.R8, TRACK_RES, TRACK_RES);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const f = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, f);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
    if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) { track.broken = true; }
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    track.tex[i] = t; track.fbo[i] = f;
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.bindTexture(gl.TEXTURE_2D, null);
})();

const stampVao = gl.createVertexArray(), stampVbo = gl.createBuffer();
const STAMP_MAX = 256;                           /* quads per frame */
const STAMP_FLOATS = 6 * 4;                      /* 2 triangles × (x, z, side, strength) */
const stampData = new Float32Array(STAMP_MAX * STAMP_FLOATS);
let stampCount = 0;
gl.bindVertexArray(stampVao);
gl.bindBuffer(gl.ARRAY_BUFFER, stampVbo);
gl.bufferData(gl.ARRAY_BUFFER, stampData.byteLength, gl.DYNAMIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 4, gl.FLOAT, false, 16, 0);
gl.bindVertexArray(null);

/* The blit that re-anchors the map also dims it, which is how the wind takes
   ruts back. Circling in one spot never re-anchors, though, so a timer forces a
   zero-shift blit as well — otherwise doughnuts would be permanent. */
const TRACK_FADE_EVERY = 3.0;
function recentreTracks(px, pz, dt) {
  const nx = Math.round((px - TRACK_SPAN / 2) / TRACK_TEXEL) * TRACK_TEXEL;
  const nz = Math.round((pz - TRACK_SPAN / 2) / TRACK_TEXEL) * TRACK_TEXEL;
  track.fadeT += dt || 0;
  const moved = Math.abs(nx - track.origin.x) >= TRACK_STEP || Math.abs(nz - track.origin.z) >= TRACK_STEP;
  if (track.ready && !moved && track.fadeT < TRACK_FADE_EVERY) return;
  track.fadeT = 0;
  const shiftX = (nx - track.origin.x) / TRACK_SPAN, shiftZ = (nz - track.origin.z) / TRACK_SPAN;
  const src = track.cur, dst = 1 - src;
  gl.bindFramebuffer(gl.FRAMEBUFFER, track.fbo[dst]);
  gl.viewport(0, 0, TRACK_RES, TRACK_RES);
  gl.disable(gl.BLEND); gl.disable(gl.DEPTH_TEST);
  gl.useProgram(P.blit.p);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, track.tex[src]);
  gl.uniform1i(P.blit.u.uSrc, 0);
  gl.uniform2f(P.blit.u.uShift, shiftX, shiftZ);
  /* the sand slowly takes the ruts back */
  gl.uniform1f(P.blit.u.uFade, track.ready ? 0.982 : 0.0);
  gl.bindVertexArray(null);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  track.cur = dst;
  track.origin.x = nx; track.origin.z = nz;
  track.ready = true;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}

function pushStamp(ax, az, bx, bz, halfW, strength) {
  if (stampCount >= STAMP_MAX) return;
  let dx = bx - ax, dz = bz - az;
  const len = Math.hypot(dx, dz);
  if (len < 1e-4) { dx = 1; dz = 0; } else { dx /= len; dz /= len; }
  const px = -dz * halfW, pz = dx * halfW;
  /* extend the ends a little so consecutive segments overlap without gaps */
  const ex = dx * halfW * 0.5, ez = dz * halfW * 0.5;
  const o = stampCount * STAMP_FLOATS, s = strength;
  const q = [
    ax - ex + px, az - ez + pz, 1, s, ax - ex - px, az - ez - pz, -1, s, bx + ex + px, bz + ez + pz, 1, s,
    bx + ex + px, bz + ez + pz, 1, s, ax - ex - px, az - ez - pz, -1, s, bx + ex - px, bz + ez - pz, -1, s
  ];
  for (let i = 0; i < STAMP_FLOATS; i++) stampData[o + i] = q[i];
  stampCount++;
}

function flushStamps() {
  if (!stampCount || track.broken) { stampCount = 0; return; }
  gl.bindFramebuffer(gl.FRAMEBUFFER, track.fbo[track.cur]);
  gl.viewport(0, 0, TRACK_RES, TRACK_RES);
  gl.disable(gl.DEPTH_TEST);
  gl.enable(gl.BLEND);
  /* MAX, not ONE+ONE: consecutive segments overlap at their end caps by design,
     and summing there beads the rut into a chain of bright lumps. Taking the
     deeper of the two also means the stored value stays an actual rut depth
     rather than an accumulator that saturates after three passes. */
  gl.blendEquation(gl.MAX);
  gl.blendFunc(gl.ONE, gl.ONE);
  gl.useProgram(P.stamp.p);
  gl.uniform2f(P.stamp.u.uOrigin, track.origin.x, track.origin.z);
  gl.uniform1f(P.stamp.u.uSpan, TRACK_SPAN);
  gl.bindVertexArray(stampVao);
  gl.bindBuffer(gl.ARRAY_BUFFER, stampVbo);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, stampData.subarray(0, stampCount * STAMP_FLOATS));
  gl.drawArrays(gl.TRIANGLES, 0, stampCount * 6);
  gl.bindVertexArray(null);
  gl.blendEquation(gl.FUNC_ADD);
  gl.disable(gl.BLEND);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  stampCount = 0;
}

/* Lay a segment under each wheel that is touching down. This runs per physics
   step, so a segment is normally a few centimetres; the split is insurance for
   the case where the step budget is exhausted and one step covers real ground. */
const TRACK_SEG = 1.2;
function layTracks() {
  if (track.broken) return;
  for (let i = 0; i < 4; i++) {
    const wl = car.wheels[i];
    if (!wl.contact) { wl.tx = undefined; continue; }
    if (wl.tx === undefined) { wl.tx = wl.cx; wl.tz = wl.cz; }
    const d = Math.hypot(wl.cx - wl.tx, wl.cz - wl.tz);
    if (d < 0.08) continue;
    /* deeper when the tyre is loaded or scrabbling, fainter on the packed road.
       Load is against the static quarter weight, so a wheel going light over a
       crest barely marks and a hard landing gouges. */
    const road = roadness(wl.cx, wl.cz);
    const load = Math.min(1.35, wl.load / (CARP.mass * 9.81 * 0.25));
    const s = Math.min(1, (0.34 + Math.min(wl.slip, 1) * 0.42) * load * (1 - road * 0.75));
    if (s < 0.01) { wl.tx = wl.cx; wl.tz = wl.cz; continue; }
    const n = Math.min(Math.ceil(d / TRACK_SEG), 8);
    const sx = wl.tx, sz = wl.tz, ddx = (wl.cx - sx) / n, ddz = (wl.cz - sz) / n;
    for (let k = 0; k < n; k++) {
      pushStamp(sx + ddx * k, sz + ddz * k, sx + ddx * (k + 1), sz + ddz * (k + 1), 0.26, s);
    }
    wl.tx = wl.cx; wl.tz = wl.cz;
  }
}

/* ------------------------------------------------ dust ----------------- */
const DUST_MAX = 260;
const dust = {
  px: new Float32Array(DUST_MAX), py: new Float32Array(DUST_MAX), pz: new Float32Array(DUST_MAX),
  vx: new Float32Array(DUST_MAX), vy: new Float32Array(DUST_MAX), vz: new Float32Array(DUST_MAX),
  life: new Float32Array(DUST_MAX), max: new Float32Array(DUST_MAX), sz: new Float32Array(DUST_MAX),
  head: 0, gpu: new Float32Array(DUST_MAX * 5), live: 0
};
const dustVao = gl.createVertexArray(), dustVbo = gl.createBuffer();
gl.bindVertexArray(dustVao);
gl.bindBuffer(gl.ARRAY_BUFFER, dustVbo);
gl.bufferData(gl.ARRAY_BUFFER, DUST_MAX * 5 * 4, gl.DYNAMIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 20, 0);
gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 2, gl.FLOAT, false, 20, 12);
gl.bindVertexArray(null);

function spawnDust(x, y, z, vx, vy, vz, life, size) {
  const i = dust.head++ % DUST_MAX;
  dust.px[i] = x; dust.py[i] = y; dust.pz[i] = z;
  dust.vx[i] = vx; dust.vy[i] = vy; dust.vz[i] = vz;
  dust.life[i] = life; dust.max[i] = life; dust.sz[i] = size;
}
function updateDust(dt) {
  let n = 0;
  for (let i = 0; i < DUST_MAX; i++) {
    if (dust.life[i] <= 0) continue;
    dust.life[i] -= dt;
    if (dust.life[i] <= 0) continue;
    const d = Math.exp(-1.4 * dt);
    dust.vx[i] *= d; dust.vz[i] *= d;
    dust.vy[i] = dust.vy[i] * d + 0.55 * dt;
    dust.px[i] += dust.vx[i] * dt;
    dust.py[i] += dust.vy[i] * dt;
    dust.pz[i] += dust.vz[i] * dt;
    const age = 1 - dust.life[i] / dust.max[i];
    const o = n * 5;
    dust.gpu[o] = dust.px[i]; dust.gpu[o + 1] = dust.py[i]; dust.gpu[o + 2] = dust.pz[i];
    dust.gpu[o + 3] = dust.sz[i] * (0.5 + age * 2.6);
    dust.gpu[o + 4] = Math.min(1, (1 - age) * 1.6) * 0.30 * Math.min(1, age * 5);
    n++;
  }
  dust.live = n;
  if (n) {
    gl.bindBuffer(gl.ARRAY_BUFFER, dustVbo);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, dust.gpu.subarray(0, n * 5));
  }
}
let dustAccum = 0;
function emitWheelDust(dt) {
  const sp = vlen(car.v);
  dustAccum += dt * (car.slipAvg * 46 + Math.min(sp, 30) * 0.7 * (1 - car.surface * 0.8));
  while (dustAccum > 1) {
    dustAccum -= 1;
    let best = -1, bs = 0.15;
    for (let i = 0; i < 4; i++) {
      const s = car.wheels[i].contact * (car.wheels[i].slip + 0.25);
      if (s > bs) { bs = s; best = i; }
    }
    if (best < 0) { dustAccum = 0; break; }
    const wl = car.wheels[best];
    const j = () => (Math.random() - 0.5);
    spawnDust(
      wl.cx + j() * 0.5, wl.cy - 0.25 + j() * 0.2, wl.cz + j() * 0.5,
      -car.v.x * 0.16 + j() * 2.2, 0.5 + Math.random() * 1.4, -car.v.z * 0.16 + j() * 2.2,
      0.8 + Math.random() * 1.1, 26 + Math.random() * 42
    );
  }
}

/* --------------------------------------- ground-conformed blob shadow --- */
const SH_NX = 15, SH_NZ = 9;
const shadowVerts = new Float32Array(SH_NX * SH_NZ * 4);
const shadowVao = gl.createVertexArray(), shadowVbo = gl.createBuffer();
gl.bindVertexArray(shadowVao);
gl.bindBuffer(gl.ARRAY_BUFFER, shadowVbo);
gl.bufferData(gl.ARRAY_BUFFER, shadowVerts.byteLength, gl.DYNAMIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 16, 0);
gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 1, gl.FLOAT, false, 16, 12);
(function () {
  const idx = new Uint16Array((SH_NX - 1) * (SH_NZ - 1) * 6);
  let p = 0;
  for (let j = 0; j < SH_NZ - 1; j++)
    for (let i = 0; i < SH_NX - 1; i++) {
      const a = j * SH_NX + i, b = a + 1, c = a + SH_NX, d = c + 1;
      idx[p++] = a; idx[p++] = c; idx[p++] = b; idx[p++] = b; idx[p++] = c; idx[p++] = d;
    }
  const ib = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idx, gl.STATIC_DRAW);
  gl.bindVertexArray(null);
})();
const SH_COUNT = (SH_NX - 1) * (SH_NZ - 1) * 6;

function updateShadow() {
  const h = Math.max(0.4, car.p.y - heightAt(car.p.x, car.p.z));
  const off = clamp(h / SUN_TAN, 0, 26) * 0.38;
  const cx = car.p.x - SUN_HX * off, cz = car.p.z - SUN_HZ * off;
  const a = 3.5 + off * 0.5, b = 1.95;
  const strength = clamp(1 - car.airborne * 0.55, 0.25, 1) * clamp(1 - (h - 0.6) * 0.25, 0.2, 1);
  let p = 0;
  for (let j = 0; j < SH_NZ; j++) {
    const v = (j / (SH_NZ - 1) - 0.5) * 2;
    for (let i = 0; i < SH_NX; i++) {
      const u = (i / (SH_NX - 1) - 0.5) * 2;
      const x = cx + SUN_HX * u * a - SUN_HZ * v * b;
      const z = cz + SUN_HZ * u * a + SUN_HX * v * b;
      const r = Math.hypot(u, v);
      shadowVerts[p] = x;
      shadowVerts[p + 1] = heightAt(x, z) + 0.05;
      shadowVerts[p + 2] = z;
      shadowVerts[p + 3] = (1 - smoothstep(0.12, 1.0, r)) * 0.72 * strength;
      p += 4;
    }
  }
  gl.bindBuffer(gl.ARRAY_BUFFER, shadowVbo);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, shadowVerts);
}

/* ------------------------------------ 6 camera / input / hud / audio ---- */
const cam = { p: v3(0, 0, -10), look: v3(), fov: 63 * DEG, mode: 0, init: false };
let coverBlend = 1;                       // 1 = cover orbit, 0 = gameplay chase
const _cp = v3(), _cl = v3();
function coverCamera(t) {
  const ang = 2.35 + t * 0.055;
  const r = 9.8;
  vset(_cp, car.p.x + Math.sin(ang) * r, car.p.y + 2.5 + Math.sin(t * 0.31) * 0.28, car.p.z + Math.cos(ang) * r);
  const gh = heightAt(_cp.x, _cp.z) + 1.6;
  if (_cp.y < gh) _cp.y = gh;
  const wide = canvas.width > canvas.height;
  vset(_cl, car.p.x, car.p.y + (wide ? 0.35 : 1.75), car.p.z);
  const b = coverBlend * coverBlend * (3 - 2 * coverBlend);
  cam.p.x = mix(cam.p.x, _cp.x, b); cam.p.y = mix(cam.p.y, _cp.y, b); cam.p.z = mix(cam.p.z, _cp.z, b);
  cam.look.x = mix(cam.look.x, _cl.x, b); cam.look.y = mix(cam.look.y, _cl.y, b); cam.look.z = mix(cam.look.z, _cl.z, b);
  cam.fov = mix(cam.fov, 44 * DEG, b);
}
const _flat = v3(0, 0, 1), _des = v3(), _lk = v3();

function updateCamera(dt) {
  vset(_flat, car.fwd.x, 0, car.fwd.z);
  if (Math.hypot(_flat.x, _flat.z) < 0.05) vset(_flat, 0, 0, 1);
  vnorm(_flat, _flat);
  const sp = vlen(car.v);

  if (cam.mode === 1) {                       // cockpit
    qrot(_des, car.q, vset(_tmp, 0.40, 0.86, 0.10));
    vadd(_des, car.p, _des);
    vcopy(cam.p, _des);
    vaddScaled(_lk, cam.p, car.fwd, 12);
    vaddScaled(_lk, _lk, car.up, 0.9);
    vcopy(cam.look, _lk);
    cam.fov = (66 + Math.min(sp, 42) * 0.18) * DEG;
    return;
  }

  const aspect = canvas.width / Math.max(1, canvas.height);
  const k = clamp(1 / (0.55 + 0.45 * Math.min(aspect, 1.4)), 1, 1.45);   // pull back when upright
  const back = (cam.mode === 2 ? 16.5 : 8.8) * k;
  const high = (cam.mode === 2 ? 6.4 : 3.05) * (0.6 + 0.4 * k);
  _des.x = car.p.x - _flat.x * back + car.v.x * 0.10;
  _des.y = car.p.y + high;
  _des.z = car.p.z - _flat.z * back + car.v.z * 0.10;

  if (!cam.init) { vcopy(cam.p, _des); cam.init = true; }
  const lag = 1 - Math.exp(-dt * (4.2 + sp * 0.10));
  cam.p.x += (_des.x - cam.p.x) * lag;
  cam.p.y += (_des.y - cam.p.y) * lag * 1.25;
  cam.p.z += (_des.z - cam.p.z) * lag;

  const gh = heightAt(cam.p.x, cam.p.z) + 1.7;
  if (cam.p.y < gh) cam.p.y = gh;

  _lk.x = car.p.x + _flat.x * 5.5 + car.v.x * 0.16;
  _lk.y = car.p.y + 1.15;
  _lk.z = car.p.z + _flat.z * 5.5 + car.v.z * 0.16;
  const llag = 1 - Math.exp(-dt * 9);
  cam.look.x += (_lk.x - cam.look.x) * llag;
  cam.look.y += (_lk.y - cam.look.y) * llag;
  cam.look.z += (_lk.z - cam.look.z) * llag;
  cam.fov = (61 + Math.min(sp, 44) * 0.30) * DEG;
}

/* tilt steering */
function onTilt(e) {
  const ang = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
  let raw;
  if (ang === 90) raw = -(e.beta || 0);
  else if (ang === 270 || ang === -90) raw = (e.beta || 0);
  else raw = (e.gamma || 0);
  if (input.tiltZero === null) input.tiltZero = raw;
  input.tiltVal = clamp((raw - input.tiltZero) / 20, -1, 1);
}
function enableTilt() {
  const start = () => { input.tilt = true; input.tiltZero = null; addEventListener('deviceorientation', onTilt); };
  const DOE = window.DeviceOrientationEvent;
  if (DOE && typeof DOE.requestPermission === 'function') {
    DOE.requestPermission().then(r => { if (r === 'granted') start(); }).catch(() => {});
  } else if (DOE) start();
}
function disableTilt() { input.tilt = false; removeEventListener('deviceorientation', onTilt); }

function readInput(dt) {
  const kL = (keys['ArrowLeft'] || keys['KeyA']) ? 1 : 0;
  const kR = (keys['ArrowRight'] || keys['KeyD']) ? 1 : 0;
  let s = input.steer;
  if (kL || kR) s = kR - kL;
  else if (input.tilt) s = input.tiltVal;
  car.steerInput += (s - car.steerInput) * Math.min(1, dt * 12);
  car.throttle = Math.max(input.gas, (keys['ArrowUp'] || keys['KeyW']) ? 1 : 0);
  car.brake = Math.max(input.brake, (keys['ArrowDown'] || keys['KeyS']) ? 1 : 0);
  car.hand = Math.max(input.hand, keys['Space'] ? 1 : 0);
}

/* ---------------- audio ---------------- */
const audio = { ctx: null, on: true, nodes: null };
function initAudio() {
  if (audio.ctx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const ctx = new AC();
  const master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
  const o1 = ctx.createOscillator(); o1.type = 'sawtooth';
  const o2 = ctx.createOscillator(); o2.type = 'square'; o2.detune.value = -8;
  const eg = ctx.createGain(); eg.gain.value = 0.16;
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 620; lp.Q.value = 4;
  o1.connect(eg); o2.connect(eg); eg.connect(lp); lp.connect(master);
  const len = Math.floor(ctx.sampleRate * 2);
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const ch = buf.getChannelData(0);
  for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
  const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
  const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 780; bp.Q.value = 0.5;
  const ng = ctx.createGain(); ng.gain.value = 0;
  src.connect(bp); bp.connect(ng); ng.connect(master);
  o1.start(); o2.start(); src.start();
  audio.ctx = ctx;
  audio.nodes = { master, o1, o2, lp, ng, bp };
}
function updateAudio() {
  if (!audio.ctx || !audio.nodes) return;
  const n = audio.nodes, t = audio.ctx.currentTime;
  const sp = Math.abs(vdot(car.v, car.fwd));
  const rpm = 0.10 + Math.min(sp, CARP.vMax) / CARP.vMax * 0.9;
  const f = 34 + rpm * 128 + car.throttle * 22;
  n.o1.frequency.setTargetAtTime(f, t, 0.06);
  n.o2.frequency.setTargetAtTime(f * 0.5, t, 0.06);
  n.lp.frequency.setTargetAtTime(420 + car.throttle * 1500 + rpm * 900, t, 0.08);
  const wind = Math.min(1, vlen(car.v) / 34) * 0.5 + car.slipAvg * 0.5;
  n.ng.gain.setTargetAtTime(wind * 0.10, t, 0.12);
  n.bp.frequency.setTargetAtTime(600 + wind * 1400, t, 0.12);
  n.master.gain.setTargetAtTime(audio.on ? 0.55 : 0, t, 0.15);
}

/* a short metallic bang: noise burst through a resonant band, plus a low thud */
function crashSound(strength) {
  const ctx = audio.ctx;
  if (!ctx || !audio.nodes) return;
  const t = ctx.currentTime;
  const len = Math.floor(ctx.sampleRate * 0.32);
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const ch = buf.getChannelData(0);
  for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6);
  const src = ctx.createBufferSource(); src.buffer = buf;
  const bp = ctx.createBiquadFilter();
  bp.type = 'bandpass'; bp.frequency.value = 380 + strength * 900; bp.Q.value = 1.4;
  const g = ctx.createGain();
  g.gain.setValueAtTime(Math.min(0.5, 0.14 + strength * 0.5), t);
  g.gain.exponentialRampToValueAtTime(0.0008, t + 0.30);
  src.connect(bp); bp.connect(g); g.connect(audio.nodes.master);
  src.start(t); src.stop(t + 0.34);

  const o = ctx.createOscillator(), og = ctx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(120 + strength * 60, t);
  o.frequency.exponentialRampToValueAtTime(38, t + 0.20);
  og.gain.setValueAtTime(Math.min(0.45, 0.12 + strength * 0.45), t);
  og.gain.exponentialRampToValueAtTime(0.0008, t + 0.24);
  o.connect(og); og.connect(audio.nodes.master);
  o.start(t); o.stop(t + 0.26);
}

(function buildTape() {

  for (let d = -190; d <= 550; d += 5) {

let hudT = 0;
function updateHud(dt) {
  const heading = ((Math.atan2(-car.fwd.x, car.fwd.z) / DEG) + 360) % 360;
  hudTape.style.transform = 'translateX(' + (compassEl.clientWidth / 2 - heading * PPD) + 'px)';

  hudSurf.textContent = car.surface > 0.35 ? 'TRACK' : 'SAND';
  hudDist.textContent = (Math.hypot(car.p.x, car.p.z) / 1000).toFixed(1);
  const hull = Math.round((1 - crash.damage) * 100);
  hudDmg.textContent = hull;
  hudDmg.className = hull < 45 ? 'bad' : (hull < 80 ? 'warn' : '');
  hudHits.textContent = crash.hits;
  hudDmgFill.style.width = (crash.damage * 100) + '%';
  let best = null, bd = 1e9;
  for (const s of WRECK_SITES) {
    const d = Math.hypot(s.x - car.p.x, s.z - car.p.z);
    if (d < bd) { bd = d; best = s; }
  }
  if (best) {
    const b = ((Math.atan2(-(best.x - car.p.x), best.z - car.p.z) / DEG) + 360) % 360;
    hudBearing.textContent = 'WRECK ' + (bd / 1000).toFixed(1) + 'KM · ' +
      String(Math.round(b)).padStart(3, '0') + '°';
  }
}

/* ------------------------------------------------ 7 render + main loop -- */
const projM = m4(), viewM = m4(), vpM = m4(), invVP = m4(), modelM = m4();
const frustum = new Float32Array(24);
const _wq = qid(), _wq2 = qid(), _wq3 = qid(), _wp = v3();

function drawInstanced(m) {
  if (!m.inst) return;
  gl.bindVertexArray(m.vao);
  gl.drawArraysInstanced(gl.TRIANGLES, 0, m.count, m.inst);
}

function render() {
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.clearColor(0, 0, 0, 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  /* sky */
  gl.disable(gl.DEPTH_TEST);
  gl.depthMask(false);
  bindCommon(P.sky, vpM, cam.p);
  gl.uniformMatrix4fv(P.sky.u.uInvVP, false, invVP);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  gl.enable(gl.DEPTH_TEST);
  gl.depthFunc(gl.LEQUAL);
  gl.depthMask(true);
  gl.enable(gl.CULL_FACE);

  const calls = drawTerrain(vpM, cam.p);

  /* props */
  bindCommon(P.inst, vpM, cam.p);
  drawInstanced(MESH.rockA);
  drawInstanced(MESH.rockB);
  drawInstanced(MESH.pylon);
  drawInstanced(MESH.wreck);
  drawInstanced(MESH.cactusA);
  drawInstanced(MESH.cactusB);
  drawInstanced(MESH.hat);
  drawInstanced(MESH.drum);

  /* car */
  bindCommon(P.mesh, vpM, cam.p);
  m4FromQuatPos(modelM, car.q, car.p);
  gl.uniformMatrix4fv(P.mesh.u.uModel, false, modelM);
  gl.bindVertexArray(MESH.car.vao);
  gl.drawArrays(gl.TRIANGLES, 0, MESH.car.count);
  for (let i = 0; i < 4; i++) {
    const wl = car.wheels[i];
    qAxisAngle(_wq2, 0, 1, 0, CARP.mounts[i].steer ? -car.steer : 0);
    qAxisAngle(_wq3, 1, 0, 0, wl.spin);
    qmul(_wq, car.q, _wq2);
    qmul(_wq, _wq, _wq3);
    vset(_wp, wl.cx, wl.cy, wl.cz);
    m4FromQuatPos(modelM, _wq, _wp);
    gl.uniformMatrix4fv(P.mesh.u.uModel, false, modelM);
    gl.bindVertexArray(MESH.wheel.vao);
    gl.drawArrays(gl.TRIANGLES, 0, MESH.wheel.count);
  }

  /* cables */
  if (cableVerts > 1) {
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    bindCommon(P.line, vpM, cam.p);
    gl.bindVertexArray(cableVao);
    gl.drawArrays(gl.LINES, 0, cableVerts);
    gl.disable(gl.BLEND);
  }

  /* ground shadow — multiplies the terrain underneath */
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ZERO, gl.SRC_COLOR);
  gl.depthMask(false);
  gl.disable(gl.CULL_FACE);
  bindCommon(P.shadow, vpM, cam.p);
  gl.bindVertexArray(shadowVao);
  gl.drawElements(gl.TRIANGLES, SH_COUNT, gl.UNSIGNED_SHORT, 0);
  gl.enable(gl.CULL_FACE);

  /* dust */
  if (dust.live) {
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    bindCommon(P.dust, vpM, cam.p);
    gl.uniform1f(P.dust.u.uPxScale, canvas.height / 900);
    gl.bindVertexArray(dustVao);
    gl.drawArrays(gl.POINTS, 0, dust.live);
  }
  gl.depthMask(true);
  gl.disable(gl.BLEND);
  gl.bindVertexArray(null);
  return calls;
}

/* ---------------- viewport ---------------- */
let quality = 1.0;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const vw = (window.visualViewport && window.visualViewport.width) || innerWidth;
  const vh = (window.visualViewport && window.visualViewport.height) || innerHeight;
  const w = Math.max(2, Math.round(vw * dpr * quality));
  const h = Math.max(2, Math.round(vh * dpr * quality));
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  canvas.style.width = vw + 'px';
  canvas.style.height = vh + 'px';
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 220));
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

/* ---------------- adaptive quality ---------------- */
let ftAvg = 16, qTimer = 0, qLocked = 0;
function adapt(dt) {
  ftAvg = ftAvg * 0.93 + dt * 1000 * 0.07;
  qTimer += dt;
  if (qTimer < 1.6) return;
  qTimer = 0;
  if (ftAvg > 23 && quality > 0.62) { quality = Math.max(0.62, quality - 0.11); resize(); }
  else if (ftAvg > 23 && !qLocked) {
    qLocked = 1; MIN_LEAF = 96; SPLIT = 1.35; FAR_CULL = 1900;
  } else if (ftAvg < 13.5 && quality < 1.0) { quality = Math.min(1, quality + 0.06); resize(); }
}

/* ---------------- boot + loop ---------------- */
const PH = 1 / 120;
let last = performance.now(), acc = 0, booting = true, maxPending = 1, showFps = false;
const bootStart = performance.now();
resize();
resetCar(true);
for (let i = 0; i < 260; i++) carStep(1 / 120);   // let the suspension settle for the cover
vset(cam.look, car.p.x, car.p.y + 1, car.p.z + 5);

const bootEl = el('boot'), barFill = el('bar-fill'), statusEl = el('status'), goBtn = el('go');
/* portrait gets the artwork, landscape gets the live orbit */
function pickCover() {
  const portrait = innerHeight > innerWidth * 1.05;
  document.body.classList.toggle('art', portrait && !!COVER_ART);
  if (portrait && COVER_ART && !el('coverart').style.backgroundImage)
    el('coverart').style.backgroundImage = 'url("' + COVER_ART + '")';
}
pickCover();
addEventListener('resize', pickCover);
addEventListener('orientationchange', () => setTimeout(pickCover, 220));
let ready = false;

function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.25) dt = 0.25;
  if (dt <= 0) dt = 1 / 60;
  frameNo++;

  if (!booting) {
    readInput(dt);
    acc += dt;
    let steps = 0;
    /* Track laying runs per physics step, not per frame: at 20 fps a frame
       moves a wheel 2 m, and sampling contact once across that drops whole
       stretches of rut. Re-anchor first so every stamp this frame shares one
       origin — a frame moves the truck far less than the margin left below. */
    recentreTracks(car.p.x, car.p.z, dt);
    while (acc >= PH && steps < 8) { carStep(PH); layTracks(); acc -= PH; steps++; }
    if (acc > PH * 4) acc = 0;
    flushStamps();
    emitWheelDust(dt);
    adapt(dt);
  }
  updateDust(dt);
  updateCamera(dt);
  if (coverBlend > 0) {
    coverCamera((now - bootStart) / 1000);
    if (!booting) coverBlend = Math.max(0, coverBlend - dt / 1.7);
  }
  if (booting) {
    /* sand streaming across the frame on the wind */
    if (Math.random() < 0.55) {
      const a = Math.random() * 6.283, r = 7 + Math.random() * 26;
      const x = car.p.x + Math.cos(a) * r, z = car.p.z + Math.sin(a) * r;
      spawnDust(x, heightAt(x, z) + 0.25 + Math.random() * 1.6, z,
        WDX * (5 + Math.random() * 5), 0.25 + Math.random() * 0.5, WDZ * (5 + Math.random() * 5),
        1.8 + Math.random() * 1.6, 22 + Math.random() * 34);
    }
  }

  /* impact shake, decaying — on the eye only, so the aim stays steady */
  if (crash.shake > 0.002) {
    const s = crash.shake * 0.38, t = now * 0.001;
    cam.p.x += Math.sin(t * 71.3) * s;
    cam.p.y += Math.sin(t * 53.7 + 1.7) * s;
    cam.p.z += Math.sin(t * 89.1 + 3.1) * s;
  }

  const aspect = canvas.width / Math.max(1, canvas.height);
  let fov = cam.fov;
  const minH = 48 * DEG;
  if (2 * Math.atan(Math.tan(fov / 2) * aspect) < minH) fov = 2 * Math.atan(Math.tan(minH / 2) / aspect);
  m4Perspective(projM, Math.min(fov, 110 * DEG), aspect, 0.3, 8000);
  m4LookAt(viewM, cam.p, cam.look, UP);
  m4Mul(vpM, projM, viewM);
  m4Invert(invVP, vpM);
  frustumFrom(vpM, frustum);

  updateTerrain(car.p.x, car.p.z, frustum, booting ? 16 : 5);
  /* tracks are stamped before the scene is drawn, into their own target */
  if (booting) recentreTracks(car.p.x, car.p.z, 0);
  updateScatter(cam.p.x, cam.p.z);
  updateProps(car.p.x, car.p.z);
  updateDrums(dt);
  updatePylons(car.p.x, car.p.z);
  updateShadow();
  const calls = render();
  updateHud(dt);
  updateAudio();

  if (booting) {
    maxPending = Math.max(maxPending, pendingCount);
    const prog = 1 - pendingCount / maxPending;
    barFill.style.width = Math.round(prog * 100) + '%';
    statusEl.textContent = pendingCount ? 'GENERATING TERRAIN · ' + Math.round(prog * 100) + '%' : 'READY';
    if (frameNo === 3) bootEl.classList.add('lit');     // lift the curtain on the live scene
    if (!ready && (pendingCount === 0 || performance.now() - bootStart > 12000) && frameNo > 3) {
      ready = true;
      goBtn.classList.add('ready');
    }
  } else if (showFps) {
    hudFps.textContent = Math.round(1000 / ftAvg) + ' FPS · ' + calls + ' CH · Q' + quality.toFixed(2);
  }
}

function start() {
  if (!ready) return;
  booting = false;
  last = performance.now();
  acc = 0;
  bootEl.classList.add('gone');
  document.getElementById('hud').classList.add('live');
  setTimeout(() => { bootEl.style.display = 'none'; }, 700);
  initAudio();
  if (audio.ctx && audio.ctx.state === 'suspended') audio.ctx.resume();
  keepAwake();
  setTimeout(() => { el('hint').style.opacity = '0'; }, 7000);
}
goBtn.addEventListener('click', start);
goBtn.addEventListener('pointerdown', e => e.stopPropagation());

/* the explicit reset also beats the panels back out — the automatic one after a
   roll does not, or you could undo damage by flipping on purpose */
el('b-res').addEventListener('click', () => { resetCar(false); repairCar(); });
el('b-cam').addEventListener('click', e => {
  cam.mode = (cam.mode + 1) % 3;
  e.currentTarget.classList.toggle('on', cam.mode !== 0);
});
el('b-aud').addEventListener('click', e => {
  audio.on = !audio.on;
  initAudio();
  if (audio.ctx && audio.ctx.state === 'suspended') audio.ctx.resume();
  e.currentTarget.classList.toggle('on', audio.on);
});
el('b-tilt').addEventListener('click', e => {
  if (input.tilt) { disableTilt(); e.currentTarget.classList.remove('on'); }
  else { enableTilt(); e.currentTarget.classList.add('on'); }
});
el('b-aud').classList.add('on');
addEventListener('keydown', e => { if (e.code === 'KeyF') { showFps = !showFps; if (!showFps) hudFps.textContent = ''; } });
document.addEventListener('visibilitychange', () => { if (!document.hidden) last = performance.now(); });

requestAnimationFrame(frame);
</script>
</body>
</html>
